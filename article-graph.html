function graph(){
  const edges = S.mode === 'focus' ? focusGraphEdges(S.focus) : mapEdges();
  const ids = new Set();
  edges.forEach(c => { ids.add(c.sk); ids.add(c.ok); });
  if (S.mode === 'focus') ids.add(S.focus);
  return { edges, nodes: Array.from(ids).map(i => NODES[i]) };
}

/* =================== layout =================== */
const W = 900, H = 560;
function rng(seed){ return () => (seed = seed * 1664525 + 1013904223 >>> 0) / 4294967296; }
function layoutMap(nodes, edges){
  const r = rng(20250102), pos = {};
  nodes.forEach((n, i) => {
    const a = i / nodes.length * Math.PI * 2;
    pos[n.id] = { x: W/2 + Math.cos(a) * 220 + (r()-.5)*40, y: H/2 + Math.sin(a) * 170 + (r()-.5)*40, vx:0, vy:0 };
  });
  const link = edges.map(e => [e.sk, e.ok]);
  for (let it = 0; it < 420; it++){
    const k = 1 - it/420;
    for (let i = 0; i < nodes.length; i++) for (let j = i+1; j < nodes.length; j++){
      const a = pos[nodes[i].id], b = pos[nodes[j].id];
      let dx = a.x-b.x, dy = a.y-b.y, d2 = dx*dx+dy*dy || 1;
      if (d2 > 160000) continue;
      const f = 15000 / d2, d = Math.sqrt(d2);
      a.vx += dx/d*f; a.vy += dy/d*f; b.vx -= dx/d*f; b.vy -= dy/d*f;
    }
    link.forEach(([s,o]) => {
      const a = pos[s], b = pos[o]; if (!a || !b) return;
      const dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy) || 1, f = (d-175) * 0.012;
      a.vx += dx/d*f; a.vy += dy/d*f; b.vx -= dx/d*f; b.vy -= dy/d*f;
    });
    nodes.forEach(n => { const p = pos[n.id];
      p.vx += (W/2 - p.x) * 0.004; p.vy += (H/2 - p.y) * 0.004;
      p.x += p.vx * k; p.y += p.vy * k; p.vx *= .82; p.vy *= .82; });
  }
  return fit(nodes, pos);
}
function layoutFocus(nodes, edges){
  const pos = {}, others = nodes.filter(n => n.id !== S.focus);
  pos[S.focus] = { x: W/2, y: H/2 };
  others.forEach((n, i) => {
    const a = -Math.PI/2 + i / Math.max(others.length,1) * Math.PI * 2;
    pos[n.id] = { x: W/2 + Math.cos(a)*215, y: H/2 + Math.sin(a)*160 };
  });
  return fit(nodes, pos);
}
function fit(nodes, pos){
  const xs = nodes.map(n => pos[n.id].x), ys = nodes.map(n => pos[n.id].y);
  const pad = 64, x0 = Math.min(...xs)-pad, x1 = Math.max(...xs)+pad, y0 = Math.min(...ys)-pad, y1 = Math.max(...ys)+pad;
  const s = Math.min(W/(x1-x0), H/(y1-y0));
  nodes.forEach(n => { const p = pos[n.id];
    p.x = (p.x-x0)*s + (W-(x1-x0)*s)/2; p.y = (p.y-y0)*s + (H-(y1-y0)*s)/2; });
  return pos;
}

/* =================== graph render =================== */
let POS = {};
function radius(n){
  if (n.kind === 'concept') return 7;
  if (S.mode === 'focus' && n.id === S.focus) return 30;
  return Math.min(27, 10 + Math.sqrt(n.deg) * 3.4);
}
function shortLabel(s){ return s.length > 26 ? s.slice(0, 24).trim() + '…' : s; }
function drawGraph(){
  const { nodes, edges } = graph();
  const svg = $('#svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  if (!nodes.length){
    svg.innerHTML = `<text x="${W/2}" y="${H/2}" fill="#8d99ad" font-size="15" text-anchor="middle" font-family="system-ui">No claims in this section. Choose another.</text>`;
    $('#hint').textContent = ''; return;
  }
  POS = S.mode === 'focus' ? layoutFocus(nodes, edges) : layoutMap(nodes, edges);
  const near = new Set();
  if (S.sel && S.sel.t === 'node'){ near.add(S.sel.id);
    edges.forEach(c => { if (c.sk === S.sel.id) near.add(c.ok); if (c.ok === S.sel.id) near.add(c.sk); }); }
  const showLab = edges.length <= 34;
  const pairIdx = {}, pairN = {};
  edges.forEach(c => { const k = [c.sk, c.ok].sort().join('~'); pairN[k] = (pairN[k] || 0) + 1; });
  const E = edges.map(c => {
    const a = POS[c.sk], b = POS[c.ok]; if (!a || !b) return '';
    const pk = [c.sk, c.ok].sort().join('~');
    pairIdx[pk] = (pairIdx[pk] || 0) + 1;
    const bow = (pairIdx[pk] - (pairN[pk] + 1) / 2) * 34;
    const on = S.sel && (S.sel.t === 'edge' ? S.sel.id === c.id : (c.sk === S.sel.id || c.ok === S.sel.id));
    const dim = S.sel && !on;
    const ux = b.x-a.x, uy = b.y-a.y, ul = Math.hypot(ux,uy) || 1;
    const cx = (a.x+b.x)/2 - uy/ul*bow, cy = (a.y+b.y)/2 + ux/ul*bow;
    const mx = (a.x+b.x)/4 + cx/2, my = (a.y+b.y)/4 + cy/2;
    const path = `M${a.x} ${a.y} Q${cx} ${cy} ${b.x} ${b.y}`;
    let ang = Math.atan2(b.y-a.y, b.x-a.x) * 180/Math.PI;
    if (ang > 90 || ang < -90) ang += 180;
    const len = ul;
    const near = len < Math.max(104, esc(c.p).length * 7.2) && !on;
    const lab = (showLab || on) && !dim
      ? `<text class="elab${on?' on':''}${near?' near':''}" x="${mx}" y="${my-4}" transform="rotate(${ang.toFixed(1)} ${mx} ${my})">${esc(c.p)}</text>` : '';
    return `<g class="ed" data-edge="${c.id}" style="cursor:pointer">
      <path class="edge${on?' on':dim?' dim':''}" d="${path}"></path>
      <path stroke="transparent" stroke-width="14" fill="none" d="${path}"></path>${lab}</g>`;
  }).join('');
  const N = nodes.map(n => {
    const p = POS[n.id], r = radius(n);
    const dim = S.sel && !(S.sel.t === 'node' ? near.has(n.id) : (() => { const c = CLAIMS.find(x => x.id === S.sel.id); return c && (c.sk === n.id || c.ok === n.id); })());
    const sel = S.sel && S.sel.t === 'node' && S.sel.id === n.id;
    const c = col(n.type, true);
    return `<g class="node ${n.kind}${n.kind==='concept'?' sm':''}${dim?' dim':''}${sel?' sel':''}" data-node="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.label)}">
      <circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${n.kind==='concept'?'none':c}" stroke="${n.kind==='concept'?c:'var(--field)'}"></circle>
      <text x="${p.x}" y="${p.y + r + 14}">${esc(shortLabel(n.label))}</text></g>`;
  }).join('');
  svg.innerHTML = E + N;
  $('#back').hidden = S.mode !== 'focus';
  const total = S.mode === 'focus' ? focusEdges(S.focus).length : 0;
  $('#hint').textContent = S.mode === 'focus'
    ? `${nodes.length - 1} named term${nodes.length===2?'':'s'} linked to ${NODES[S.focus].label}. All ${total} of its claims are listed on the right.`
    : `${edges.length} link${edges.length===1?'':'s'} between named terms. Select a term to read everything it is linked to.`;
}

/* =================== inspector =================== */
function claimHTML(c, hiId){
  const sec = SECS[c.sec];
  const nd = k => `<b style="color:${col(NODES[k].type)}">${esc(NODES[k].label)}</b>`;
  return `<div class="claim">
    <div class="triple">${nd(c.sk)} <span class="pred">${esc(c.p)}</span> ${nd(c.ok)}</div>
    ${c.ev ? `<p class="ev">${esc(c.ev)}</p>` : ''}
    <div class="where"><span>${esc(sec.type)} · ${esc(sec.title)}</span>
      <button data-read="${c.sec}" data-hi="${esc(hiId || c.sk)}">Read the passage</button></div>
  </div>`;
}
function inspector(){
  const box = $('#insp');
  if (!S.sel){
    box.innerHTML = `<p class="empty">Select a term to see what the article says about it, or a link to see the sentence behind it.
      <br><br>Bigger circles carry more claims. The map links named terms only; claims about a phrase appear here and in the list below.</p>`;
    return;
  }
  if (S.sel.t === 'edge'){
    const c = CLAIMS.find(x => x.id === S.sel.id);
    box.innerHTML = `<span class="tag" style="background:var(--accent)">one claim</span>
      <h2 style="font-size:17px;margin-top:10px">${esc(NODES[c.sk].label)} ${esc(c.p)} ${esc(NODES[c.ok].label)}</h2>
      <p class="sub">Stated in the ${esc(SECS[c.sec].type)}</p>${claimHTML(c)}`;
    return;
  }
  const n = NODES[S.sel.id];
  const cs = visibleClaims().filter(c => c.sk === n.id || c.ok === n.id);
  const secs = Array.from(new Set(cs.map(c => c.st)));
  box.innerHTML = `
    <span class="tag ${n.kind === 'concept' ? 'concept' : ''}" ${n.kind === 'concept' ? '' : `style="background:${col(n.type)}"`}>${esc(typeName(n.type))}</span>
    <h2>${esc(n.label)}</h2>
    <p class="sub">${cs.length} claim${cs.length===1?'':'s'}${n.mentions ? ` · named in ${n.mentions} passage${n.mentions===1?'':'s'}` : ''}
      ${secs.length ? `<br>Appears in: ${secs.map(esc).join(', ')}` : ''}
      ${n.variants && n.variants.length > 1 ? `<br>Also written as: ${n.variants.map(esc).join(', ')}` : ''}
      ${n.url ? `<br><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.url.replace(/^https?:\/\//,''))}</a>` : ''}</p>
    ${n.kind === 'entity' && !(S.mode === 'focus' && S.focus === n.id) ? `<button class="ghost" data-focus="${esc(n.id)}">Centre the map on this</button>` : ''}
    <h3>What the article says</h3>
    ${cs.length ? cs.map(c => claimHTML(c, n.id)).join('') : '<p class="empty">No claims in the section you have selected.</p>'}`;
}

/* =================== head, controls, legend =================== */
function gist(s){
  const parts = s.split(/(?<=[a-z0-9\)])\.\s+(?=[A-Z])/);
  let out = '';
  for (const p of parts){ if (out.length > 230) break; out += (out ? ' ' : '') + p.replace(/\.*$/, '') + '.'; }
  return out;
}
function renderHead(){
  const ents = DATA.nodes.filter(n => n.kind === 'entity').length;
  const counts = [[SECTYPES.length,'sections'],[DATA.sections.length,'passages'],[ents,'named terms'],
                  [CLAIMS.length,'claims, each with its sentence'],[FIGS.length,'figures']];
  $('#head').innerHTML = `
    <p class="meta">${esc(A.journal)} · ${esc(A.date)} · <a href="https://doi.org/${esc(A.doi)}" target="_blank" rel="noopener">doi ${esc(A.doi)}</a></p>
    <h1>${esc(A.title)}</h1>
    <p class="authors">${esc(A.authors.join(', '))}</p>
    <div class="counts">${counts.map(c => `<div><b>${c[0]}</b><span>${esc(c[1])}</span></div>`).join('')}</div>
    <p class="gist">${esc(gist(A.abstract))}</p>
    <p style="margin:12px 0 0">${A.keywords.map(k => `<span class="kw">${esc(k)}</span>`).join('')}</p>`;
}
function renderCtl(){
  $('#ctl').innerHTML = `
    <div class="seg">${['all'].concat(SECTYPES).map(s =>
      `<button data-sec="${s}" aria-pressed="${S.sec===s}">${s === 'all' ? 'Whole article' : esc(s)}</button>`).join('')}</div>
    <input class="find" id="find" type="search" placeholder="Find a term" value="${esc(S.q)}" aria-label="Find a term">
    <span id="findout" class="ghost" style="text-decoration:none"></span>`;
  const types = Array.from(new Set(DATA.nodes.filter(n => n.kind === 'entity' && n.deg).map(n => n.type))).sort();
  $('#legend').innerHTML = types.map(t => `<span><i style="background:${col(t)}"></i>${esc(typeName(t))}</span>`).join('')
;
}
function doFind(q){
  S.q = q;
  const out = $('#findout'); if (!q){ out.textContent = ''; return; }
  const hits = DATA.nodes.filter(n => n.deg && n.label.toLowerCase().includes(q.toLowerCase()))
                         .sort((a,b) => b.deg - a.deg).slice(0, 6);
  out.innerHTML = hits.length ? hits.map(n => `<button class="ghost" data-pick="${esc(n.id)}" style="margin:0 10px 0 0">${esc(n.label)}</button>`).join('')
                              : '<span style="color:var(--muted)">no match</span>';
}

/* =================== tabs =================== */
const TABS = [['claims','Every claim'],['sections','Read the article'],['figures','Figures'],['flags','Data check']];
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(([id,label]) =>
    `<button data-tab="${id}" aria-selected="${S.tab===id}">${esc(label)}${id==='flags'?` (${DATA.flags.length})`:''}</button>`).join('');
  $('#pane').innerHTML = { claims: paneClaims, sections: paneSections, figures: paneFigures, flags: paneFlags }[S.tab]();
}
function paneClaims(){
  const q = S.cq.toLowerCase();
  const list = CLAIMS.filter(c => (S.csec === 'all' || c.st === S.csec) &&
    (!q || (c.s+' '+c.p+' '+c.o+' '+c.ev).toLowerCase().includes(q)));
  return `<div class="filters">
      <div class="seg">${['all'].concat(SECTYPES).map(s => `<button data-csec="${s}" aria-pressed="${S.csec===s}">${s==='all'?'All':esc(s)}</button>`).join('')}</div>
      <input class="find" id="cfind" type="search" placeholder="Search claims and sentences" value="${esc(S.cq)}" aria-label="Search claims">
      <span class="note" style="align-self:center">${list.length} of ${CLAIMS.length}</span></div>
    ${list.length ? list.map(c => `<div class="row">${claimHTML(c)}</div>`).join('')
                  : '<p class="note">Nothing matches. Try a shorter search.</p>'}`;
}
function paneSections(){
  return SECTYPES.map(t => {
    const ss = DATA.sections.filter(s => s.type === t);
    return `<h3 style="margin:18px 0 8px;font:600 13px/1 var(--ui);color:var(--muted);letter-spacing:.04em">${esc(t)} · ${ss.length} passage${ss.length===1?'':'s'}</h3>` +
      ss.map((s, i) => {
        const nc = CLAIMS.filter(c => c.sec === s.id).length;
        const generic = s.title.toLowerCase().replace(/[^a-z]/g,'') === t.replace(/[^a-z]/g,'');
        const head = generic ? `${t} · passage ${i+1} of ${ss.length}` : s.title;
        const peek = (s.summary || s.text).replace(/^This [a-z ]+ section from the article (discusses|describes|details|outlines|covers)\s*/i,'');
        return `<details class="sect" id="sec-${esc(s.id)}">
        <summary><span>${esc(head)}<br><span class="stype" style="text-transform:none">${esc(peek.slice(0,96))}${peek.length>96?'…':''}</span></span><span class="stype">${s.ents.length} term${s.ents.length===1?'':'s'} · ${nc} claim${nc===1?'':'s'}</span></summary>
        <div class="body"><p class="sum"><span style="display:block;font:600 11.5px/1 var(--ui);letter-spacing:.04em;margin-bottom:5px">summary written by the enrichment, not by the authors</span>${esc(s.summary)}</p><p data-text="${esc(s.id)}">${esc(s.text)}</p>
        ${s.figs.length ? `<p class="note">Refers to ${s.figs.map(f => esc((FIGS.find(x=>x.id===f)||{}).name || f)).join(', ')}.</p>` : ''}</div></details>`; }).join('');
  }).join('');
}
function paneFigures(){
  return FIGS.map(f => `<div class="fig"><h4>${esc(f.name)}</h4><p class="cap">${esc(f.caption)}</p>
    ${f.text ? `<p class="sum" style="margin-top:10px">${esc(f.text)}</p>` : ''}
    ${f.cited.length ? `<p class="note" style="margin-top:10px">Discussed in: ${f.cited.map(id => `<button class="ghost" data-read="${esc(id)}">${esc(SECS[id].title)}</button>`).join(' · ')}</p>` : ''}</div>`).join('');
}
function paneFlags(){
  return `<p class="note" style="margin-bottom:14px">Automatic extraction is not perfect. These are things worth a human look before this data is published or sold. This panel is for the publisher, not the reader.</p>`
    + DATA.flags.map(f => `<div class="flag"><b>${esc(f.k)}</b>${esc(f.d)}</div>`).join('');
}

/* =================== read a passage =================== */
function readPassage(secId, hiId){
  S.tab = 'sections'; renderTabs();
  const det = document.getElementById('sec-' + secId);
  if (!det) return;
  det.open = true;
  const p = det.querySelector('[data-text]'), s = SECS[secId];
  const terms = [];
  if (hiId && NODES[hiId]) terms.push(...(NODES[hiId].variants || [NODES[hiId].label]));
  let html = esc(s.text);
  terms.filter(Boolean).sort((a,b) => b.length - a.length).forEach(t => {
    html = html.replace(new RegExp('(?<!<[^>]*)' + reEsc(esc(t)), 'gi'), m => `<mark>${m}</mark>`);
  });
  p.innerHTML = html;
  det.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

/* =================== events =================== */
document.addEventListener('click', e => {
  const t = e.target; let el;
  if ((el = t.closest('[data-sec]'))){ S.sec = el.dataset.sec; S.sel = null; if (S.mode==='focus' && !focusEdges(S.focus).length){ S.mode='map'; } renderCtl(); drawGraph(); inspector(); return; }
  if ((el = t.closest('[data-node]'))){ S.sel = { t:'node', id: el.dataset.node }; drawGraph(); inspector(); return; }
  if ((el = t.closest('[data-edge]'))){ S.sel = { t:'edge', id: el.dataset.edge }; drawGraph(); inspector(); return; }
  if ((el = t.closest('[data-focus]'))){ S.mode='focus'; S.focus = el.dataset.focus; S.sel = { t:'node', id: el.dataset.focus }; drawGraph(); inspector(); return; }
  if ((el = t.closest('[data-pick]'))){ S.sel = { t:'node', id: el.dataset.pick };
    if (S.mode==='map' && !mapEdges().some(c => c.sk===el.dataset.pick || c.ok===el.dataset.pick)){ S.mode='focus'; S.focus = el.dataset.pick; S.sel = { t:'node', id: el.dataset.pick }; }
    drawGraph(); inspector(); return; }
  if (t.closest('#back')){ S.mode='map'; S.sel=null; drawGraph(); inspector(); return; }
  if ((el = t.closest('[data-read]'))){ readPassage(el.dataset.read, el.dataset.hi); return; }
  if ((el = t.closest('[data-tab]'))){ S.tab = el.dataset.tab; renderTabs(); return; }
  if ((el = t.closest('[data-csec]'))){ S.csec = el.dataset.csec; renderTabs(); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (S.sel || S.mode === 'focus')){ S.sel = null; S.mode = 'map'; drawGraph(); inspector(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('[data-node]')){ e.preventDefault(); e.target.closest('[data-node]').dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'find') doFind(e.target.value);
  if (e.target.id === 'cfind'){ S.cq = e.target.value; const pos = e.target.selectionStart; renderTabs();
    const f = $('#cfind'); if (f){ f.focus(); f.setSelectionRange(pos, pos); } }
});
document.addEventListener('dblclick', e => {
  const el = e.target.closest('[data-node]');
  if (el && NODES[el.dataset.node].kind === 'entity'){ S.mode='focus'; S.focus = el.dataset.node; S.sel = { t:'node', id: el.dataset.node }; drawGraph(); inspector(); }
});

renderHead(); renderCtl(); drawGraph(); inspector(); renderTabs();
</script>
</body></html>
