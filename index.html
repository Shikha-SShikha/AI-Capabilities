<style>
:root{--bg:#f5f6f8;--fg:#121821;--muted:#5d6675;--card:#ffffff;--line:#e1e5ec;--accent:#1f5fd0;--accent-soft:#e8f0fd;--ok:#1d7a4a;--ok-soft:#e6f5ec;--warn:#945700;--warn-soft:#fff1d1;--bad:#b3261e;--bad-soft:#fde8e6;--org-bg:#e6f5ec;--org-fg:#1d7a4a;--cell-bg:#e8f0fd;--cell-fg:#1a54b8;--gene-bg:#f3ecfc;--gene-fg:#6a3fbf;--mod-bg:#fff0d1;--mod-fg:#945700}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit}
header{padding:8px 16px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand-logo{height:44px;width:auto;display:block}

.hbtn{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 8px;border-radius:8px}
.hbtn:hover{color:var(--fg)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin:10px 0 0;padding:0 16px}
.steps button{text-align:left;padding:7px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.steps button small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.steps button[aria-current="step"]{border-color:var(--accent);background:var(--accent-soft)}
main{padding:10px 16px 10px;flex:1;min-height:0;display:flex;flex-direction:column}
.stage{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.stage>*{flex-shrink:0}
.stage .frame{flex:1;min-height:0;display:flex;flex-direction:column}
.stage .frame iframe{flex:1;height:auto;min-height:0}
.frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.frame iframe{display:block;width:100%;height:100%;border:0}
.frame iframe[hidden]{display:none}
h1{font-size:23px;line-height:1.2;margin:0 0 4px}
h3{margin:0 0 4px;font-size:14px;font-weight:600}
.h-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lead{color:var(--muted);margin:0 0 18px;max-width:64ch}
.problem{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:6px 0 20px;color:var(--muted);max-width:70ch}
.problem b{color:var(--fg);font-weight:600}
.muted{color:var(--muted)}
.fine{font-size:13px;color:var(--muted);margin:10px 0 0}
.fine a,.link-btn{color:var(--accent)}
.link-btn{background:none;border:0;padding:0;cursor:pointer;font-size:14px;text-decoration:underline}
.status{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.s-live{color:var(--ok);border-color:var(--ok)}
.s-prototype{color:var(--accent);border-color:var(--accent)}
.s-concept{color:var(--warn);border-color:var(--warn)}
.s-sample{border-style:dashed}
.btn{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[aria-pressed="true"]{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.pill[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pill.ghost{border-style:dashed;color:var(--muted)}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}

/* Enrich */
.enrich{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(260px,1fr);gap:20px;align-items:start}
@media (max-width:820px){.enrich,.derive{grid-template-columns:1fr}}
.passage{font:16px/1.7 Charter,"Iowan Old Style","Palatino Linotype",Georgia,serif;border:1px solid var(--line);border-radius:12px;padding:24px 28px;background:var(--bg);max-width:none}
.sent{border-radius:6px;transition:background .2s}
.sent.hi{background:color-mix(in srgb,var(--accent) 20%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.ctx{display:none;font:600 12px/1 system-ui,sans-serif}
.enrich.on.l-ctx .ctx{display:inline-block;margin-right:8px;padding:4px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);vertical-align:2px}
.ent{border-radius:5px;padding:1px 3px;margin:0 -1px;transition:background .5s,color .5s,box-shadow .2s}
.enrich.on.l-ent .ent{cursor:pointer}
.enrich.on.l-ent .t-org{background:var(--org-bg);color:var(--org-fg)}
.enrich.on.l-ent .t-cell{background:var(--cell-bg);color:var(--cell-fg)}
.enrich.on.l-ent .t-gene{background:var(--gene-bg);color:var(--gene-fg)}
.enrich.on.l-ent .t-mod{background:var(--mod-bg);color:var(--mod-fg)}
.enrich.on.l-ent .ent.sel{box-shadow:0 0 0 2px currentColor}
.insp{border:1px solid var(--line);border-radius:12px;padding:16px;align-self:start;background:var(--bg)}
.chipt{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;margin-bottom:6px}
.chipt.t-org{background:var(--org-bg);color:var(--org-fg)}.chipt.t-cell{background:var(--cell-bg);color:var(--cell-fg)}.chipt.t-gene{background:var(--gene-bg);color:var(--gene-fg)}.chipt.t-mod{background:var(--mod-bg);color:var(--mod-fg)}
.insp p{margin:4px 0}
.relbox{display:none;margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.enrich.on.l-rel .relbox{display:block}
.rel{display:block;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;margin-top:6px;font-size:14px}
.rel b{color:var(--accent);font-weight:600}
.rel[aria-pressed="true"]{border-color:var(--accent)}
.reads{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:14px}

/* Derive */
.derive{display:grid;grid-template-columns:minmax(240px,1fr) minmax(0,2fr);gap:20px;margin-top:10px}
.dright{columns:2;column-gap:28px}
.dright > .sec{break-inside:avoid}
.dright .span{column-span:all}
@media (max-height:820px){.sec p{font-size:12.5px;line-height:1.4}.sec{padding:4px 0}.derive{margin-top:6px}.pick{margin-bottom:8px}.kw{padding:3px 8px}.stage{padding:12px 16px}h1{font-size:21px}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.kw{padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);cursor:pointer;font-size:14px}
.kw[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.ev{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:14px;margin-bottom:14px}
.ev p{margin:4px 0 0}
mark.k{background:#ffe58a;color:#121821;border-radius:3px;padding:0 2px}
.terms{margin:4px 0 0;padding-left:18px;font-size:14px}
.paper{font-size:14px;color:var(--muted);margin:0 0 6px}
.paper strong{color:var(--fg)}
.sec{border-top:1px solid var(--line);padding:6px 0;break-inside:avoid}
.sec:first-of-type{border-top:0;padding-top:4px}
.sec h3{color:var(--accent);text-transform:capitalize}
.sec p{margin:0;max-width:none;font-size:13px;line-height:1.45}
.qa{font-size:14px;margin-top:10px;padding:8px 12px;border-radius:8px}
.qa.ok{background:var(--ok-soft);color:var(--ok)}
.qa.warn{background:var(--warn-soft);color:var(--warn)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}

/* Offer */
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.offer{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);display:flex;flex-direction:column;gap:5px}
.offer .btn{align-self:flex-start;padding:7px 14px;font-size:14px}
.offer{cursor:pointer}
.offer:hover{border-color:var(--accent)}
.offer:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.offer.feat{border-color:var(--accent)}
.o-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--accent)}
.offer strong{font-size:16px}
.o-d{color:var(--muted);font-size:13px;line-height:1.4}
.needs{display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.needs span.l{padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.legend{margin-top:16px;font-size:13px;color:var(--muted)}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(10,14,20,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.on{display:flex}
.sheet.wide{width:min(1200px,100%);max-height:97vh}
.sheet.wide .agframe{height:80vh}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;width:min(780px,100%);max-height:92vh;overflow:auto;position:relative}
.sheet h2{margin:4px 0 4px;font-size:24px}
.sheet .x{position:absolute;right:14px;top:10px;border:0;background:none;font-size:26px;color:var(--muted);cursor:pointer}
.aud{font-size:13px;color:var(--accent)}
.constructed{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:13px;margin:10px 0}
.srcs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
@media (max-width:700px){.srcs{grid-template-columns:1fr}}
.srcc{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);font-size:14px}
.srcc p{margin:6px 0 0}
mark.v{background:#ffe58a;color:#121821;border-radius:3px;padding:0 3px}
mark.bad{background:var(--bad-soft);color:var(--bad);border-radius:3px;padding:0 3px;font-weight:600}
.flagbox{border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:10px 14px;font-size:14px;margin:12px 0}
.flagbox.dim{border-color:var(--line);background:var(--bg);color:var(--muted)}
.draft{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:14px;background:var(--bg)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;color:var(--muted);font-weight:500;font-size:13px;padding:6px 8px}
.tbl td{padding:4px 8px}
.cellbtn{width:100%;text-align:left;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.cellbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.xinsp{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);font-size:14px;min-height:96px}
.xinsp dl{margin:6px 0 0;display:grid;grid-template-columns:90px 1fr;gap:4px 10px}
.xinsp dt{color:var(--muted)}.xinsp dd{margin:0}
pre.json{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:300px;overflow:auto;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;margin:10px 0 0}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}

/* Notes */
#notes{position:fixed;right:16px;bottom:72px;width:min(380px,calc(100% - 32px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.18);display:none;z-index:5;font-size:14px}
#notes.on{display:block}
#notes p{margin:6px 0 0}
#notes b{color:var(--accent);font-weight:600}

.nav{display:flex;justify-content:space-between;margin-top:10px;padding:0 16px}
.nav button{padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.nav button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.nav button:disabled{opacity:.4;cursor:default}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.xnote{color:var(--muted);font-size:13px;margin:8px 0 0}
.agframe{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;height:min(640px,70vh)}
.agframe iframe{display:block;width:100%;height:100%;border:0}
.sgroups{display:grid;gap:8px;margin-top:12px}
.sg{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--bg)}
.sg summary{cursor:pointer;font-weight:600}
.sg ul{margin:8px 0 2px;padding-left:18px;font-size:14px;color:var(--muted)}

.scan{display:grid;gap:10px;margin-top:14px}
.sgrp{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 16px}
.sgrp > summary{cursor:pointer;font-weight:600;padding:12px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
.sgrp > summary::-webkit-details-marker{display:none}
.sgrp > summary::after{content:"+";color:var(--muted);font-weight:400;font-size:18px}
.sgrp[open] > summary::after{content:"−"}
.cnt{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
.spap{border-top:1px solid var(--line);padding:12px 0}
.spap h4{margin:0 0 4px;font-size:15px;line-height:1.35}
.spap .who{color:var(--accent)}
.hook{margin:0 0 8px;font-size:14px;font-weight:500}
.spap dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px}
.spap dt{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.5px;padding-top:2px}
.spap dd{margin:0;color:var(--fg)}
.flag{margin:8px 0 0;font-size:12px;color:var(--muted);font-style:italic}
.patterns{margin-top:12px}
.pat{padding:10px 0;border-top:1px solid var(--line)}
.pat b{font-size:13px}
.pat p{margin:4px 0 0;font-size:13px;color:var(--muted)}

header{transition:background .2s}
.hright{display:flex;align-items:center;gap:14px}
.brand-logo{height:44px;width:auto;display:block}
.abs-title{margin:14px 0 2px;font-size:18px}
.muted-line{color:var(--muted);font-size:13px;margin:0 0 10px}
</style></head><body>

clusions": "This research highlights the critical role of m6A RNA methylation in the host-parasite interaction dynamics during T. annulata infection, suggesting that m6A modifications influence cellular proliferation and may serve as potential therapeutic targets in managing the disease."}, "issues": ["method is 71 words, budget 80 to 105"]}, {"subject": "Humanities", "field": "History · Narrative", "title": "Fantasizing history between subjectivity and objectivity", "doi": "10.1080/23311983.2024.2335787", "venue": "", "sa": {"background": "The interplay between subjectivity and objectivity in historical writing has been a topic of limited exploration, despite its significance in understanding how narratives are constructed. Historians strive for objectivity, yet their work is inherently influenced by personal perspectives, leading to a complex relationship between factual recounting and imaginative interpretation.", "objective": "This study aims to explore the relationship between subjectivity and objectivity in historical narratives, focusing on how fantasizing can bridge these two domains.", "method": "The research employs a descriptive approach to analyze the mechanisms through which narrative and history intersect. It examines the roles of historians and narrators, investigating their convergence and divergence. The study also scrutinizes the concept of fantasizing as a lens to understand subjectivity in both historical and narrative contexts, addressing the challenges posed by their inherent contradictions.", "results": "The findings reveal that both historians and novelists operate within a framework of subjectivity, despite their differing methodologies. Historians are bound to factual accuracy, while novelists prioritize emotional engagement and stylistic expression. The study identifies a transformative process where historical facts are reimagined within narratives, creating a unique synthesis that enriches literary expression. This synthesis allows for a . It introduces a refined definition of diagram size and a new metric for topographic layout quality, showing both to be objectively applicable. The impact of diagram size and quality on understanding is quantified, with a recommendation that diagrams should not exceed 50 elements and a flaw rate of 0.5. The study extends findings to two additional UML diagram types. Additionally, the study finds that diagram quality, as measured by layout flaws, has a more significant impact on understanding than size alone, suggesting a need for prioritizing quality improvements.", "conclusions": "The study confirms the overall results of previous research, refining recommendations for creating better UML diagrams. It suggests that reducing layout flaws should be prioritized over reducing diagram size to improve understanding. Future work should explore other aspects of diagram quality, such as flow and symmetry, which are less empirically studied."}, "issues": []}, {"subject": "Digital humanities", "field": "Musicology · Digital libraries", "title": "Collaborative Musicology: Designing a Digital Library of Musical Events Ephemera", "doi": "", "venue": "10th International Conference on Digital Libraries for Musicology (DLfM 2023), November 10, 2023, Milan, Italy", "sa": {"background": "Ephemeral musical sources, such as concert programmes, have been marginalized in musicological research despite their potential to enrich understanding of musical culture. These documents provide structured records of performances and reflect local and broader cultural trends.", "objective": "The paper aims to design a Digital Library for musical events ephemera, integrating diverse document types to facilitate collaborative musicological research.", "method": "The authors developed a prototype Digital Library using Greenstone3, Mirador Annotation Viewer, and SimpleAnnotationServer. They incorporated metadata-rich collections of concert programmes, season brochures, and other documents, employing OCR and linked data to enhance accessibility and interactivity. The system supports annotations and integrates with external resources, allowing for comprehensive data exploration. The library includes features for searching, browsing, and user comments, and uses a combination of high-resolution and DIY digitization methods to accommodate various document types.", "results": "The prototype Digital Library contains 3,971 items, including 115 digitized documents with 5,268 pages, covering concerts from 1918 to 2020. It allows users to search, browse, and annotate documents, linking them to external resources like music scores and recordings. The system effectively manages heterogeneous content, supports collaborative research by enabling user-generated annotations and comments, and provides enhanced search capabilities through OCR and linked data. The integration of Greenstone3, Mirador, and SimpleAnnotationServer allows for dynamic interaction with the content, making the library a versatile tool for musicological inquiry.", "conclusions": "The project demonstrates the feasibility of creating a collaborative Digital Library for musical ephemera, highlighting the potential for enhanced musicological research. Future work includes refining the system's architecture and expanding its capabilities to handle more complex semantic information and user interactions. The approach can be generalized to other cultural and community archives, offering a model for digitizing and making accessible diverse historical materials."}, "issues": []}];

}
function hl(text, term){
  const t = esc(text);
  if (!term) return t;
  return t.replace(new RegExp(reEsc(esc(term)), 'gi'), m => `<mark class="k">${m}</mark>`);
}
function secLabel(it, k){ return (LABELS[it.subject] || {})[k] || k; }
function deriveInner(){
  const it = ITEMS[S.subject], d = DERIVE[S.subject];
  const pills = ITEMS.map((x, i) => `<button class="pill" aria-pressed="${i === S.subject}" data-subject="${i}">${esc(x.subject)}</button>`).join('');
  const sents = sentencesOf(it);
  const term = S.kw != null ? d.kw[S.kw] : null;
  const kws = d.kw.map((k, i) => `<button class="kw" aria-pressed="${i === S.kw}" data-kw="${i}">${esc(k)}</button>`).join('');
  let ev = '<p class="fine" style="margin:0 0 14px">Select a keyword to see the sentence it was found in.</p>';
  if (term){
    const re = new RegExp(reEsc(term), 'gi');
    const all = sents.map(s => s.text).join(' ');
    const n = (all.match(re) || []).length;
    const hit = sents.find(s => new RegExp(reEsc(term), 'i').test(s.text));
    ev = hit ? `<div class="ev"><span class="muted">${n} mention${n === 1 ? '' : 's'}. First in ${esc(secLabel(it, hit.sec))}:</span><p>${hl(hit.text, term)}</p></div>`
             : '<div class="ev muted">Not found in the text.</div>';
  }
  const secs = Object.entries(it.sa).map(([k, v]) => `<div class="sec"><h3>${esc(secLabel(it, k))}</h3><p>${hl(v, term)}</p></div>`).join('');
  const qa = it.issues.length
    ? `<div class="qa warn"><b>Flagged by automated checks:</b> ${it.issues.map(esc).join('; ')}. Flags are shown, not hidden.</div>`
    : '<div class="qa ok">Automated checks passed.</div>';
  const meta = [it.venue, it.doi ? 'DOI ' + it.doi : ''].filter(Boolean).map(esc).join('<br>');
  const note = NOTE[it.subject] ? `<p class="note">${esc(NOTE[it.subject])}</p>` : '';
  return `
  <div class="pick" style="grid-column:1/-1">${pills}</div>
  <div>
    <h3>Keywords found in the text</h3>
    <div class="chips">${kws}</div>
    ${ev}
    <h3>Subject terms</h3>
    <ul class="terms">${d.terms.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
  </div>
  <div class="dright">
    <p class="paper span"><strong>${esc(it.title)}</strong>${meta ? '<br>' + meta : ''}</p>
    ${secs}
    <div class="span">${qa}</div>
    ${note ? `<div class="span">${note}</div>` : ''}
  </div>`;
}
function renderDerive(){
  return `
  <div class="h-row"><h1>Get keywords, abstracts and subject terms from that structure</h1>${status('sample')}</div>
  <div class="derive" id="derive">${deriveInner()}</div>`;
}
function updateDerive(){
  const el = $('#derive'); if (!el) return;
  el.innerHTML = deriveInner();
  const m = $('#derive mark.k');
  if (m && m.scrollIntoView) m.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

/* ================= Step 3: Discover ================= */
function renderDiscover(){
  return `
  <div class="h-row"><h1>Help readers find and follow the research</h1>${status('live')}</div>
  <div class="pick" style="margin-bottom:12px">
    <button class="pill" data-disc="search" aria-pressed="${S.disc === 'search'}">Search by what it says</button>
    <button class="pill" data-disc="portal" aria-pressed="${S.disc === 'portal'}">Related work, with reasons</button>
  </div>
  <div class="frame">
    <iframe id="f-search" src="${esc(CONFIG.beaconUrl)}search" title="Beacon search" ${S.disc === 'search' ? '' : 'hidden'}></iframe>
    <iframe id="f-portal" src="${esc(CONFIG.portalUrl)}" title="Reader portal" ${S.disc === 'portal' ? '' : 'hidden'}></iframe>
  </div>
  <p class="fine"><a id="openlink" href="#" target="_blank" rel="noopener">Open in a new tab</a>
    <span id="slow" hidden> · Still loading? The live site can take a moment to wake up.</span></p>`;
}
function syncDisc(){
  $('#f-search').hidden = S.disc !== 'search';
  $('#f-portal').hidden = S.disc !== 'portal';
  $$('[data-disc]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.disc === S.disc)));
  $('#openlink').href = S.disc === 'search' ? CONFIG.beaconUrl : CONFIG.portalUrl;
}
let slowTimer = null;
function mountDiscover(){
  syncDisc();
  const loaded = { search: false, portal: false };
  $('#f-search').addEventListener('load', () => { loaded.search = true; });
  $('#f-portal').addEventListener('load', () => { loaded.portal = true; });
  clearTimeout(slowTimer);
  slowTimer = setTimeout(() => { const s = $('#slow'); if (s && !loaded[S.disc]) s.hidden = false; }, 9000);
}

/* ================= Step 4: Apply ================= */
function renderOffer(){
  const cards = OFFERS.map((o, i) => `
    <article class="offer${i === 0 ? ' feat' : ''}" data-offer="${o.id}" tabindex="0" role="button" aria-label="${esc(o.t)}">
      <div class="o-top"><span>${esc(o.out)}</span>${status(CONFIG.status[o.id])}</div>
      <strong>${esc(o.t)}</strong>
      <span class="o-d">${esc(o.d)}</span>
      ${needsChips(o)}
    </article>`).join('');
  return `
  <h1>One content base, many ways to create value</h1>
  <div class="products">${cards}</div>
  <p class="legend">Also possible on the same layer: ${ALSO.map(esc).join(', ')}.</p>
  ${CONFIG.dataHandling ? `<p class="legend"><strong>How your content is handled.</strong> ${esc(CONFIG.dataHandling)}</p>` : ''}`;
}

/* ---- modal bodies ---- */
const XCELLS = {
  head: { title: 'Parasitaemia (%)', rows: [['Definition', 'Share of red blood cells that are infected.'], ['Method', 'Blood smear, 200 fields counted per sample.'], ['Caveat', 'Reported at day 7 only.']] },
  a: { title: 'Strain A: 12.4%', rows: [['Definition', 'Share of red blood cells infected at day 7.'], ['Method', 'Blood smear, 200 fields counted, n = 24 per group.'], ['Caveat', 'Confidence interval is in the supplement, not the table.']] },
  b: { title: 'Strain B: 30.1%', rows: [['Definition', 'Share of red blood cells infected at day 7.'], ['Method', 'Blood smear, 200 fields counted, n = 24 per group.'], ['Caveat', 'Counted by a different observer than Strain A.']] }
};
const EROWS = [
  { id: 1, pop: 'Adults', out: 'Yes', src: 'p. 4', q: 'Symptom scores <mark class="v">fell in the treated group</mark> compared with placebo.' },
  { id: 2, pop: 'Adults', out: 'No', src: 'p. 7', q: '<mark class="v">No difference</mark> in symptom scores was observed between groups.' },
  { id: 3, pop: 'Children', out: 'Yes', src: 'p. 2', q: 'Among children, symptoms <mark class="v">improved by week 6</mark>.' }
];
function feedJSON(view){
  const mentions = t => Array.from(t.matchAll(/\{\{(\w+)\|/g)).map(m => m[1]);
  const entities = Object.entries(ENT).map(([id, e]) => ({ id, label: e.label, type: TYPES[e.t], definition: e.def }));
  const sentences = SENT.map((s, i) => ({ id: 's' + (i + 1), text: strip(s.text), context: s.ctx, entities: Array.from(new Set(mentions(s.text))) }));
  const relations = REL.map(r => ({ subject: r.a, predicate: r.v, object: r.b, evidence: 's' + (r.s + 1) }));
  const all = { entities, sentences, relations };
  const pick = { all, entities: { entities }, context: { sentences: sentences.map(({ id, context }) => ({ id, context })) }, relationships: { relations } };
  return JSON.stringify(pick[view], null, 2);
}
const MODAL = {
  consistency: () => `
    <p class="lead">One value, three places. The check reads the abstract, the table and the figure legend, and compares them.</p>
    <p class="constructed">Constructed example, not a real paper.</p>
    <div class="srcs">
      <div class="srcc"><b>Abstract</b><p>Survival at day 14 was <mark class="v">82%</mark> in Strain A and 61% in Strain B.</p></div>
      <div class="srcc"><b>Table 2</b><table class="tbl"><tr><th>Strain</th><th>Survival, day 14</th></tr><tr><td>A</td><td><mark class="bad">28%</mark></td></tr><tr><td>B</td><td>61%</td></tr></table></div>
      <div class="srcc"><b>Figure 3 legend</b><p>Survival of Strain A (<mark class="v">82%</mark> at day 14) and Strain B.</p></div>
    </div>
    <div class="flagbox" id="cflag"><b>Mismatch found.</b> Survival for Strain A at day 14 is 82% in the abstract and Figure 3, and 28% in Table 2.</div>
    <div class="acts"><button class="btn primary" data-draft>Draft author query</button><button class="btn" data-dismiss>Not an issue</button></div>
    <div class="draft" id="cdraft" hidden>Please confirm the survival of Strain A at day 14. The abstract and Figure 3 report 82%, while Table 2 reports 28%.</div>`,
  explain: () => `
    <p class="lead">Select a number or the column heading to see what it means and how it was produced.</p>
    <p class="constructed">Constructed example, not a real paper.</p>
    <table class="tbl"><tr><th>Strain</th><th><button class="cellbtn" data-x="head" aria-pressed="false">Parasitaemia (%)</button></th></tr>
      <tr><td>A</td><td><button class="cellbtn" data-x="a" aria-pressed="false">12.4</button></td></tr>
      <tr><td>B</td><td><button class="cellbtn" data-x="b" aria-pressed="false">30.1</button></td></tr></table>
    <div class="xinsp" id="xinsp"><span class="muted">Nothing selected yet.</span></div>`,
  evidence: () => `
    <p class="lead">Question: does the treatment reduce symptoms? Select a row to see the passage it comes from.</p>
    <p class="constructed">Constructed example, not real studies.</p>
    <table class="tbl"><tr><th>Study</th><th>Population</th><th>Outcome</th><th>Source</th></tr>
    ${EROWS.map(r => `<tr><td>${r.id}</td><td>${r.pop}</td><td>${r.out}</td><td><button class="cellbtn" data-e="${r.id}" aria-pressed="false">${r.src}</button></td></tr>`).join('')}</table>
    <div class="xinsp" id="einsp"><span class="muted">Select a source to see the passage.</span></div>`,
  graph: () => `
    <p class="lead">The article's claims, sections, figures and data checks, linked to each other.</p>
    <div class="agframe"><iframe src="article-graph.html" title="Article graph" loading="lazy"></iframe></div>`,
  summary: () => `
    <p class="lead">One session, read paper by paper. Open a theme, then a paper. The cross-cutting patterns are at the end.</p>
    <p class="constructed">Real output: the session's scannable synthesis.</p>
    <div class="scan">${APPLY.scannable.groups.map((g, gi) => `
      <details class="sgrp"${gi === 0 ? ' open' : ''}><summary>${esc(g.name)} <span class="cnt">${g.papers.length}</span></summary>
        ${g.papers.map(p => `
        <article class="spap">
          <h4><span class="who">${esc(p.who)}</span> ${esc(p.title)}</h4>
          <p class="hook">${esc(p.hook)}</p>
          <dl><dt>Method</dt><dd>${esc(cap(p.method))}</dd><dt>Novelty</dt><dd>${esc(cap(p.novelty))}</dd><dt>Caveat</dt><dd>${esc(cap(p.caveat))}</dd></dl>
          ${p.flag ? `<p class="flag">${esc(p.flag)}</p>` : ''}
        </article>`).join('')}
      </details>`).join('')}
    </div>
    <details class="sgrp patterns"><summary>Cross-cutting patterns <span class="cnt">${APPLY.scannable.patterns.length}</span></summary>
      ${APPLY.scannable.patterns.map(x => `<div class="pat"><b>${esc(x.id)} · ${esc(x.kind)}: ${esc(x.title)}</b><p>${esc(x.text)}</p></div>`).join('')}
    </details>`,
  abstracts: () => `
    <p class="lead">The same five parts for every article, whatever the field. Pick a subject.</p>
    <p class="constructed">Real generated output for each paper.</p>
    <div class="pick" id="absPick">${ITEMS.map((x, i) => `<button class="pill" aria-pressed="${i === 0}" data-abs="${i}">${esc(x.subject)}</button>`).join('')}</div>
    <div id="absBody">${absBody(0)}</div>`,
  limits: () => `
    <p class="lead">What each paper says limits its own result. Read these before you rely on a finding.</p>
    <p class="constructed">Real caveats from the session's scannable synthesis.</p>
    <div class="scan">${APPLY.scannable.groups.map((g, gi) => `
      <details class="sgrp"${gi === 0 ? ' open' : ''}><summary>${esc(g.name)} <span class="cnt">${g.papers.length}</span></summary>
        ${g.papers.map(p => `<article class="spap"><h4><span class="who">${esc(p.who)}</span> ${esc(p.title)}</h4><p class="hook">${esc(cap(p.caveat))}</p></article>`).join('')}
      </details>`).join('')}
    </div>`,
  feed: () => `
    <p class="lead">What a partner would receive for one article: terms, context and relationships, each tied back to the sentence it came from.</p>
    <p class="constructed">Illustrative structure built from the sample in step 1. Delivery format is a scoping question.</p>
    <div class="pick" id="feedtabs">
      ${['all', 'entities', 'context', 'relationships'].map((v, i) => `<button class="pill" data-feed="${v}" aria-pressed="${i === 0}">${v[0].toUpperCase() + v.slice(1)}</button>`).join('')}
    </div>
    <pre class="json" id="feedjson">${esc(feedJSON('all'))}</pre>`
};
function absBody(i){
  const it = ITEMS[i];
  const secs = Object.entries(it.sa).map(([k, v]) => `<div class="sec"><h3>${esc(k)}</h3><p>${esc(v)}</p></div>`).join('');
  return `<h3 class="abs-title">${esc(it.title)}</h3><p class="muted-line">${esc(it.field)}</p>${secs}`;
}
function openOffer(id){
  const o = OFFERS.find(x => x.id === id); if (!o) return;
  $('#modal').innerHTML = `<div class="sheet${['graph','summary','abstracts','limits'].includes(id) ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(o.t)}">
    <button class="x" aria-label="Close">×</button>
    <span class="aud">${esc(o.out)}</span> ${status(CONFIG.status[id])}
    <h2>${esc(o.t)}</h2>
    ${MODAL[id]()}
    <div class="mfoot">${needsChips(o)}</div>
  </div>`;
  $('#modal').classList.add('on');
  $('#modal .x').focus();
}
function closeModal(){ $('#modal').classList.remove('on'); $('#modal').innerHTML = ''; }
/* ================= Shell ================= */
function renderNotes(){
  const n = STEPS[S.step].notes;
  $('#notes').innerHTML = `<b>Problem</b><p>${esc(n.problem)}</p><p><b>On screen</b><br>${esc(n.proof)}</p><p><b>Ask</b><br>${esc(n.ask)}</p>`;
  $('#notes').classList.toggle('on', S.notes);
}
function render(){
  const s = STEPS[S.step];
  $('#stage').innerHTML = s.render();
  if (s.mount) s.mount();
  $('#steps').innerHTML = STEPS.map((x, i) =>
    `<button data-step="${i}" ${i === S.step ? 'aria-current="step"' : ''}><strong>${i + 1}. ${esc(x.name)}</strong><small>${esc(x.sub)}</small></button>`).join('');
  $('#prev').disabled = S.step === 0;
  $('#next').textContent = S.step === STEPS.length - 1 ? 'Start over' : 'Next';
  renderNotes();
  try { history.replaceState(null, '', '#' + s.id); } catch (e) {}
  $('#stage').scrollTop = 0;
  window.scrollTo({ top: 0, behavior: 'smooth' });

}
function go(i){ if (i < 0 || i >= STEPS.length) return; S.step = i; render(); }

document.addEventListener('click', e => {
  const t = e.target; let el;
  if (t.closest('.x') || t.id === 'modal'){ closeModal(); return; }
  if ((el = t.closest('[data-step]'))){ go(+el.dataset.step); return; }
  if ((el = t.closest('[data-goto]'))){ go(IDS.indexOf(el.dataset.goto)); if (el.dataset.open) openOffer(el.dataset.open); return; }
  if ((el = t.closest('[data-offer]'))){ openOffer(el.dataset.offer); return; }
  /* Enrich */
  if (t.closest('#run')){ S.enriched = !S.enriched; if (!S.enriched){ S.ent = null; S.rel = null; } syncEnrich(); return; }
  if ((el = t.closest('[data-layer]'))){ S.layers[el.dataset.layer] = !S.layers[el.dataset.layer]; syncEnrich(); return; }
  if ((el = t.closest('[data-ent]'))){ if (S.enriched && S.layers.ent){ S.ent = el.dataset.ent; syncEnrich(); } return; }
  if ((el = t.closest('[data-rel]'))){ S.rel = S.rel === +el.dataset.rel ? null : +el.dataset.rel; syncEnrich(); return; }
  /* Derive */
  if ((el = t.closest('[data-subject]'))){ S.subject = +el.dataset.subject; S.kw = null; updateDerive(); return; }
  if ((el = t.closest('[data-kw]'))){ S.kw = S.kw === +el.dataset.kw ? null : +el.dataset.kw; updateDerive(); return; }
  /* Discover */
  if ((el = t.closest('[data-disc]'))){ S.disc = el.dataset.disc; syncDisc(); return; }
  /* Modal interactions */
  if (t.closest('[data-draft]')){ $('#cdraft').hidden = !$('#cdraft').hidden; return; }
  if (t.closest('[data-dismiss]')){ const f = $('#cflag'); f.classList.toggle('dim'); f.innerHTML = f.classList.contains('dim') ? '<b>Dismissed.</b> Marked as not an issue and logged.' : '<b>Mismatch found.</b> Survival for Strain A at day 14 is 82% in the abstract and Figure 3, and 28% in Table 2.'; return; }
  if ((el = t.closest('[data-x]'))){
    const c = XCELLS[el.dataset.x];
    $$('[data-x]').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
    $('#xinsp').innerHTML = `<strong>${esc(c.title)}</strong><dl>${c.rows.map(r => `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>`; return;
  }
  if ((el = t.closest('[data-e]'))){
    const r = EROWS.find(x => x.id === +el.dataset.e);
    $$('[data-e]').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
    $('#einsp').innerHTML = `<strong>Study ${r.id}, ${esc(r.src)}</strong><p style="margin:6px 0 0">${r.q}</p>`; return;
  }
  if ((el = t.closest('[data-feed]'))){
    $$('[data-feed]').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
    $('#feedjson').textContent = feedJSON(el.dataset.feed); return;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closeModal(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-ent]')){ e.preventDefault(); e.target.click(); return; }
  if ($('#modal').classList.contains('on')) return;
  if (e.target.matches && e.target.matches('input,textarea,select')) return;
  if (e.key === 'ArrowRight') go(S.step + 1);
  else if (e.key === 'ArrowLeft') go(S.step - 1);
  else if (e.key === 'n' || e.key === 'N'){ S.notes = !S.notes; renderNotes(); }
});
$('#prev').onclick = () => go(S.step - 1);
$('#next').onclick = () => { S.step === STEPS.length - 1 ? go(0) : go(S.step + 1); };

/* Wake the hosted Beacon app while the presenter is still on steps 1 and 2 */
try { fetch(CONFIG.beaconUrl, { mode: 'no-cors' }).catch(() => {}); } catch (e) {}

const h0 = location.hash.slice(1);
if (IDS.includes(h0)) S.step = IDS.indexOf(h0);
render();

</script>
</body></html>
