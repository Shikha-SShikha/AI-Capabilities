<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beacon Library</title>
<style>
:root{--bg:#f5f6f8;--fg:#121821;--muted:#5d6675;--card:#fff;--line:#e1e5ec;--accent:#1f5fd0;--accent-soft:#e8f0fd;--ok:#1d7a4a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--fg:#e8ebf1;--muted:#98a2b3;--card:#161b23;--line:#262d38;--accent:#7aa7ff;--accent-soft:#1a2740;--ok:#5fd39a}}
:root[data-theme="dark"]{--bg:#0e1116;--fg:#e8ebf1;--muted:#98a2b3;--card:#161b23;--line:#262d38;--accent:#7aa7ff;--accent-soft:#1a2740;--ok:#5fd39a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{font-weight:700}.logo span{color:var(--accent)}
.search{flex:1;max-width:520px;display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.search input{flex:1;border:0;background:transparent;color:var(--fg);padding:9px 12px;font:inherit;outline:none}
.search button{border:0;background:var(--accent);color:#fff;padding:0 16px;font:inherit;cursor:pointer}
.spacer{flex:1}
.coll{font-size:13px;color:var(--muted)}
.wrap{flex:1;display:grid;grid-template-columns:260px 1fr 320px;min-height:0}
@media (max-width:1100px){.wrap{grid-template-columns:1fr}.side,.rail{display:none}}
.side{border-right:1px solid var(--line);background:var(--card);padding:18px;overflow:auto}
.side h4,.rail h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.side button{display:block;width:100%;text-align:left;font:inherit;background:none;border:0;padding:10px;border-radius:8px;color:var(--fg);cursor:pointer;margin-bottom:4px}
.side button:hover{background:var(--bg)}
.side button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.main{padding:28px 36px;overflow:auto}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin:0 0 6px}
h1{font-size:26px;line-height:1.25;margin:0 0 18px;max-width:30ch}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{font:inherit;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.sa{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.sa h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent)}
.sa p{margin:0}
.ok{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ok);margin-top:16px}
.ok::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.rail{border-left:1px solid var(--line);background:var(--card);padding:22px;overflow:auto}
.rail .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.conn{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg);margin-bottom:12px}
.conn .why{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 0 6px}
.conn strong{display:block;margin-bottom:10px}
.conn button{font:inherit;font-size:14px;padding:7px 12px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.conn button:hover{background:var(--accent-soft)}
.ok.warn{color:#a25f00}.ok.warn::before{background:#a25f00}
.empty{color:var(--muted);font-size:14px}
</style></head><body>
<header class="top">
  <div class="logo">Beacon <span>Library</span></div>
  <form class="search" onsubmit="return false"><input placeholder="Search by topic, method or result" aria-label="Search"><button>Search</button></form>
  <div class="spacer"></div>
  <div class="coll">Collection · Computing and security</div>
</header>
<div class="wrap">
  <aside class="side"><h4>In this collection</h4><div id="list"></div></aside>
  <section class="main">
    <p class="kicker">Research article</p>
    <h1 id="title"></h1>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="sa" id="sa"></div>
  </section>
  <aside class="rail">
    <h4>Connected research</h4>
    <p class="sub">Papers that share a problem, method or outcome.</p>
    <div id="conn"></div>
  </aside>
</div>
<script>
const DATA = {"articles": {"p1": {"title": "A Qualitative Analysis of Critical Thinking Skills Through Real-World Software Development Projects", "sa": {"background": "Experiential learning, particularly through Project-Based Learning (PBL) and Agile methodologies, is recognized for enhancing critical thinking and adaptability in educational settings. Recent studies highlight the need for discipline-specific strategies to cultivate higher-order thinking in technical fields, as generic assessments often show inconclusive results.", "objective": "The study aimed to evaluate the impact of experiential, client-driven projects on students' critical thinking and adaptability in an advanced undergraduate Software Development course.", "method": "The study employed an interpretative phenomenological analysis (IPA) approach to examine reflective writing from 37 students enrolled in a Software Development course. Students worked in teams to design and implement web-based applications for external clients using Agile methodologies and PBL. Data were collected through reflective writing assignments, which were analyzed using NVivo 15 to identify themes related to critical thinking and adaptability.", "results": "Three dominant themes emerged from the analysis: Communication and Collaboration, Adaptability and Flexibility, and Planning and Agile Project Management. Students reported increased confidence in troubleshooting, independent learning, and decision-making under pressure. They emphasized the importance of effective communication for team and client interactions, adaptability to manage shifting requirements and unfamiliar tools, and structured planning using Agile practices like sprints and standups. These skills were perceived as essential for professional readiness in dynamic software environments. Students also noted the development of technical skills such as using Git, Jira, React, and MongoDB, which contributed to their overall confidence and preparedness for future careers.", "conclusions": "The findings underscore the value of integrating authentic, interdisciplinary projects within computing curricula to foster critical thinking and adaptability. The study suggests embedding structured reflection and discipline-specific reasoning tasks in curricula to better prepare students for industry demands. Future research should explore the long-term impact of such educational approaches on career readiness and critical-thinking development."}, "ok": true}, "p3": {"title": "Before and After the Switch: Exploring Contributor Levels when Vendor-Controlled Open Source Projects Go Proprietary", "sa": {"background": "When vendors change their open source projects to non-open source licenses, it often leads to community backlash, forks, and concerns about sustainability. However, the actual impact on contributor activity has not been thoroughly examined.", "objective": "This study aims to investigate how contributor activity levels change following license changes in vendor-controlled open source projects.", "method": "A case study approach was employed to analyze four projects,Schema Registry, Kibana, MongoDB, and Terraform,whose licenses transitioned from OSI-approved to non-open source. Contributor activity was assessed using trace data from Git repositories collected via CHAOSS GrimoireLab. Contributors were classified into core, regular, and occasional levels, and their affiliations were distinguished as vendor-affiliated or external. The analysis compared contributor levels and activity in the year before and after the relicensing.", "results": "The findings reveal that overall project activity remained stable or modestly declined post-relicensing, with vendor-affiliated contributors continuing to account for the majority of commits. There was no evidence of a mass exodus of external core contributors; instead, a redistribution of contributor levels occurred, with some core contributors moving to lower engagement roles and previously inactive contributors becoming active. For instance, in Kibana, the proportion of affiliated commits decreased from 66% to 64%, while the number of affiliated contributors increased from 50% to 55%. Similar trends were observed across the other projects.", "conclusions": "The study concludes that relicensing does not lead to significant community departures or increased vendor-driven development as often assumed. Instead, it may stall community growth and create uncertainty for external contributors, suggesting that the perceived benefits of relicensing should be carefully weighed against its impact on community dynamics."}, "ok": true}, "p5": {"title": "Blockchain Network Deployment for Federated IoT Access Control", "sa": {"background": "The integration of blockchain with Internet of Things (IoT) systems offers opportunities for decentralized access control, but existing approaches often rely on software simulations, leaving a gap in understanding their performance on real hardware. This paper addresses the need for a practical implementation of blockchain-based authorization in IoT environments.", "objective": "This work aims to present a federated IoT access control framework that utilizes blockchain technology to enhance access management in resource-constrained environments.", "method": "A functional prototype was developed using Raspberry Pi as the Primary Group Head (PGH) to coordinate access control among subordinate ESP32 devices. The system employs Ethereum smart contracts for role assignments and policy enforcement. Key performance metrics, including authorization latency and gas costs, were measured in a physical testbed setup, which allowed for realistic evaluation of the system's performance and operational constraints.", "results": "Experimental findings revealed that average latency for key blockchain operations ranged from 300 to 600 milliseconds, with gas costs varying from hundreds to over a million for access control deployment functions. The architecture demonstrated reliable decentralized access management while maintaining practicality for resource-constrained environments. Overall, the results indicate that the proposed framework is efficient and suitable for real-world applications, providing a solid foundation for future developments in blockchain-enabled IoT access control.", "conclusions": "The proposed federated IoT access control architecture effectively bridges the gap between theoretical models and practical deployment, providing a robust solution for decentralized access management in IoT systems. Future work will focus on scalability and dynamic membership mechanisms to further enhance the system's capabilities."}, "ok": false}, "p9": {"title": "Field Devices Under Fire: A Security Assessment of Handheld Radionuclide Isotope Identification Devices", "sa": {"background": "Handheld Radionuclide Isotope Identification Devices (RIIDs) are crucial in homeland security, emergency response, and nuclear safeguards. Despite their importance, there is limited independent analysis of their security posture, and existing standards do not cover cybersecurity requirements.", "objective": "This paper aims to conduct a comprehensive security assessment of the ORTEC RADEAGLE, a commercially available RIID, to identify vulnerabilities across its system architecture and communication interfaces.", "method": "The study employed a five-layer security assessment focusing on the physical layer, communication interfaces, operating system and firmware, application and web services, and the human interface. Methods included documentation review, interface enumeration, filesystem inspection, firmware analysis, automated web-application scanning, and a controlled proof-of-concept experiment targeting configuration-integrity weaknesses.", "results": "The assessment revealed systemic vulnerabilities in the ORTEC RADEAGLE, including weak authentication, clear-text data transmission, outdated JavaScript libraries, missing security headers, and firmware components with unsafe memory handling. The proof-of-concept experiment demonstrated that configuration tampering could suppress nuclide identification without triggering user-visible warnings. Additionally, the device's reliance on hard-coded credentials and lack of secure boot mechanisms were significant security flaws. These findings indicate that compliance with standards like ANSI N42.34 does not ensure protection against cyber threats.", "conclusions": "The study highlights the need for a formalized cybersecurity evaluation process for RIIDs. It suggests implementing cryptographic integrity checks, access controls, transport security, secure update mechanisms, and operational controls to mitigate identified vulnerabilities. Future work involves assessing additional RIID devices to evaluate the prevalence of similar vulnerabilities across different products and vendors."}, "ok": true}, "p11": {"title": "Kernel-Aware Federated Learning with Multi-Teacher Knowledge Distillation and OS-Level Synchronization", "sa": {"background": "Federated learning (FL) enables collaborative model training across distributed clients without sharing raw data, but faces challenges with non-IID data, high communication latency, and resource contention in heterogeneous environments. Existing FL frameworks often rely on ad-hoc coordination mechanisms that can lead to inefficiencies and failures.", "objective": "This paper aims to present KAFLMTKDOS, a kernel-aware FL framework that integrates multi-teacher knowledge distillation and OS-level synchronization to enhance model quality and execution efficiency.", "method": "KAFLMTKDOS organizes clients into clusters based on data similarity, allowing local models to be distilled into a global student model guided by multiple teachers. Shapley values are computed using the SHAP DeepExplainer to prioritize informative features during distillation. The framework incorporates classical OS synchronization primitives, including semaphores, producer-consumer buffers, readers-writers locks, and the Banker’s algorithm, to ensure robust execution and coordination during parallel client-server training.", "results": "KAFLMTKDOS achieves up to 99.68% accuracy across datasets such as MNIST, Fashion-MNIST, and CIFAR-10, outperforming FedAvg baselines by 3 to 9%. The framework accelerates convergence by 30 to 40%, requiring 4 rounds for MNIST compared to 7 rounds for FedAvg. Additionally, it demonstrates improved resource utilization with less than 5% synchronization overhead, effectively reducing idle times and enhancing overall performance during training.", "conclusions": "The integration of OS synchronization primitives into the FL runtime not only enhances model accuracy and convergence speed but also ensures a robust, deadlock-free execution environment. KAFLMTKDOS scales effectively to 100 clients and reduces total wall-clock training time by 15 to 20%, making it suitable for deployment in resource-constrained environments."}, "ok": false}, "p14": {"title": "Practice-Informed Pedagogy for Linux Security: Perspectives on ML-Driven Solutions for Daemon Security", "sa": {"background": "Daemon security in Linux systems is underrepresented in computing curricula, despite the significant security risks posed by these background processes. Traditional detection methods are inadequate against sophisticated attacks, and there is a growing interest in machine learning (ML) for real-time threat detection. However, the application of ML to daemon security is not well addressed, creating a gap in both practical defenses and educational preparedness.", "objective": "The study aims to explore academic and industry stakeholders' perceptions of daemon security and the potential of ML-based approaches to address these security challenges, as well as to identify curricular gaps in computing education.", "method": "The study conducted semi-structured interviews with 22 IT professionals from academia and industry, using the Business Model Canvas framework to guide the discussions. Participants were asked about their roles, Linux experience, security practices, and views on ML-based security solutions. Thematic analysis was used to identify recurring themes and insights from the interviews.", "results": "Participants expressed enthusiasm for ML's potential in real-time threat detection but raised concerns about automation, trust, and data quality. Many supported hybrid approaches combining ML with traditional methods. The study found limited awareness of daemon security among participants, highlighting a gap in current curricula. Participants emphasized the importance of human oversight in automated systems and the need for transparency in ML-based tools. A disparity in security awareness across professional roles was also identified.", "conclusions": "The study concludes that integrating daemon security into computing curricula is essential, emphasizing hands-on projects and real-world applications. It highlights the importance of teaching ML in cybersecurity contexts, addressing transparency and ethical considerations. These changes can bridge the gap between theoretical instruction and practical application, better preparing students for industry challenges."}, "ok": true}, "p17": {"title": "Risk Assessment of a Hypothetical Quantum Repeater Network Using SP 800-30 and the CIA Triad", "sa": {"background": "Quantum repeaters are essential for extending the range of quantum networks by mitigating signal degradation over long distances. However, their security risks are not well understood, and existing risk assessment frameworks are not tailored for quantum systems.", "objective": "The study aims to adapt and apply the NIST SP 800-30 risk assessment framework to a hypothetical quantum repeater network to identify and prioritize security risks.", "method": "The study conducts a qualitative risk assessment on a hypothetical three-node quantum repeater network using the NIST SP 800-30 framework and the CIA triad. The network consists of three nodes: Alice, a router, and Bob, with the scope limited to the quantum repeater hardware and associated channels. The assessment uses attack taxonomies from prior quantum networking research, focusing on 17 of 26 identified threat events. The likelihood and impact of each threat are evaluated, considering factors like capability, intent, and targeting of adversarial sources.", "results": "The assessment identified two high-risk, fourteen moderate-risk, and one low-risk threat events. The highest risks are associated with physical compromise and manipulation of classical control systems, which require less specialized knowledge and equipment compared to attacks on the quantum plane. Classical message rerouting was rated as high risk due to its potential to compromise all three aspects of the CIA triad. Theft of classical hardware was also highlighted as a significant threat, as it could lead to unauthorized access to sensitive information. Quantum fault injection was identified as a moderate risk, with its impact dependent on the protection of quantum channels.", "conclusions": "The study demonstrates that classical risk assessment frameworks can be adapted for quantum systems, though they require customization for specific contexts. The findings emphasize the need for quantum-specific risk assessment frameworks and highlight the importance of empirical data to refine risk evaluations. Future work should focus on developing quantum-aware methodologies and expanding the scope to include non-adversarial threats and real-world implementations."}, "ok": true}, "p19": {"title": "Understanding Development Patterns in Corporate Open Source Projects", "sa": {"background": "Open source software (OSS) development typically involves loosely coordinated contributions from volunteers, contrasting with traditional corporate software development methods. While OSS projects have clear goals, contributors are motivated by diverse interests, necessitating a blend of collaboration mechanisms. The theory of open superposition explains how OSS contributors achieve coherent outcomes despite differing motivations, but its applicability in corporately engaged projects is less clear.", "objective": "This study aims to explore the boundaries of open superposition in corporately engaged OSS projects and identify complementary development patterns that coexist with it.", "method": "The research employs a comparative case study approach, analyzing over 160,000 pull requests (PRs) from three significant OSS projects: gRPC, Kubernetes, and Zephyr. Data was collected using the GitHub API, focusing on metrics such as lines of code added, deleted, and files modified. PRs were categorized into normal and outlier types based on their size and contribution characteristics. Statistical tests, including Mann-Whitney U tests and chi-square tests, were conducted to assess merge success rates and the impact of participation intensity on PR outcomes.", "results": "The analysis revealed that while normal PRs constituted 74-76% of total submissions, outlier PRs accounted for 97.1%, 98.9%, and 98.2% of total lines of code added in gRPC, Kubernetes, and Zephyr, respectively. Outlier PRs modified 33-54 times more lines of code and involved 10-13 times more files than normal PRs. Additionally, outlier PRs required a greater number of contributors, averaging between 4.3 to 11.5 contributors per PR, and exhibited lower merge rates compared to normal PRs, indicating their complexity and the challenges in integrating larger contributions.", "conclusions": "The findings indicate that open superposition remains a dominant collaboration mode in corporately engaged OSS projects, but it coexists with episodic large-chunk development patterns that facilitate large-scale coordination. This duality suggests that OSS development in corporate contexts involves a blend of continuous incremental contributions and strategic, coordinated efforts during critical project phases."}, "ok": false}}, "connections": [{"a": "p11", "b": "p5", "name": "Federated Learning and Synchronization"}, {"a": "p19", "b": "p3", "name": "Corporate Engagement in Open Source Software"}, {"a": "p14", "b": "p17", "name": "Linux Security and Quantum Network Risk"}]};
const LABELS = {background:'Background',objective:'Objective',method:'Method',results:'Results',conclusions:'Conclusions'};
const IDS = Object.keys(DATA.articles);
let cur = IDS[0], tab = 'results';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function partners(id){
  return DATA.connections.filter(c => c.a === id || c.b === id)
    .map(c => ({ id: c.a === id ? c.b : c.a, name: c.name }));
}
function render(){
  const a = DATA.articles[cur];
  document.getElementById('title').textContent = a.title;
  document.getElementById('list').innerHTML = IDS.map(id =>
    `<button aria-current="${id===cur}" data-id="${id}">${esc(DATA.articles[id].title)}</button>`).join('');
  document.getElementById('tabs').innerHTML = Object.keys(LABELS).map(k =>
    `<button role="tab" aria-selected="${k===tab}" data-tab="${k}">${LABELS[k]}</button>`).join('');
  document.getElementById('sa').innerHTML =
    `<h3>${LABELS[tab]}</h3><p>${esc(a.sa[tab])}</p>${a.ok ? '<div class="ok">Checked against the source</div>' : '<div class="ok warn">In review</div>'}`;
  const ps = partners(cur);
  document.getElementById('conn').innerHTML = ps.length ? ps.map(p => `
    <div class="conn"><p class="why">${esc(p.name)}</p>
      <strong>${esc(DATA.articles[p.id].title)}</strong>
      <button data-id="${p.id}">Open paper</button></div>`).join('')
    : `<p class="empty">No connections found for this paper.</p>`;
}
document.addEventListener('click', e => {
  const i = e.target.closest('[data-id]'); if (i) { cur = i.dataset.id; tab = 'results'; render(); return; }
  const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; render(); }
});
render();
</script>
</body></html>
