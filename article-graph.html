<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inside this article</title>
<style>
:root{
  --paper:#f5f5f2; --ink:#16191e; --muted:#5f6878; --line:#dfe0dc; --card:#fffffe;
  --field:#11151d; --field-2:#1a2130; --field-line:#2a3444; --field-ink:#e7ecf4; --field-muted:#8d99ad;
  --accent:#0b6b63; --accent-soft:#dff0ed;
  --t-ORGANISM:#c25e1b; --t-DISEASE:#bd3650; --t-GENE:#1f7d59; --t-PROTEIN:#2f66b5;
  --t-CHEMICAL:#7a4fc0; --t-DRUG:#916200; --t-CELL_LINE:#0d7f90; --t-BIOLOGICAL_PROCESS:#55606f;
  --t-METHOD:#55606f; --t-DEVICE:#55606f; --t-EQUIPMENT:#55606f; --t-null:#8a93a3;
  --d-ORGANISM:#e8954a; --d-DISEASE:#ef6d84; --d-GENE:#4fc795; --d-PROTEIN:#79aef0;
  --d-CHEMICAL:#b391f2; --d-DRUG:#dfb445; --d-CELL_LINE:#45c3d6; --d-BIOLOGICAL_PROCESS:#9aa6b8;
  --d-METHOD:#9aa6b8; --d-DEVICE:#9aa6b8; --d-EQUIPMENT:#9aa6b8; --d-null:#8d99ad;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --read:Charter,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--ui);
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:1360px;margin:0 auto;padding:22px 20px 60px}

/* ---------- masthead ---------- */
.meta{font-size:13px;color:var(--muted);letter-spacing:.02em}
h1{font:600 clamp(23px,2.6vw,32px)/1.25 var(--read);margin:8px 0 8px;max-width:40ch}
.authors{font-size:14px;color:var(--muted);max-width:70ch;margin:0}
.counts{display:flex;flex-wrap:wrap;gap:0;margin:20px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.counts div{padding:12px 22px 12px 0;margin-right:22px;border-right:1px solid var(--line)}
.counts div:last-child{border-right:0}
.counts b{display:block;font:600 21px/1.1 var(--ui)}
.counts span{font-size:12.5px;color:var(--muted)}
.gist{margin:18px 0 0;font:17px/1.65 var(--read);max-width:74ch}
.kw{font:12.5px/1 var(--ui);border:1px solid var(--line);border-radius:99px;padding:4px 10px;margin:0 4px 4px 0;display:inline-block;color:var(--muted);background:var(--card)}

/* ---------- layout ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,376px);gap:18px;margin-top:22px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}.insp{position:static;max-height:none}}

/* ---------- controls ---------- */
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;max-width:100%}
.seg{display:flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{padding:7px 13px;font-size:13.5px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.find{flex:1;min-width:150px;max-width:260px;padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:inherit;font-size:14px}
.ghost{font-size:13px;color:var(--muted);text-decoration:underline}

/* ---------- graph ---------- */
.field{position:relative;background:var(--field);border-radius:14px;overflow:hidden}
.field svg{display:block;width:100%;height:clamp(440px,60vh,640px);touch-action:none}
.edge{stroke:#55617a;stroke-width:1.1;fill:none}
.edge.on{stroke:#8fd6cd;stroke-width:2.1}
.edge.off{stroke:#2b3purple}
.edge.dim{stroke:#242d3c}
.elab{fill:#9fb0c6;font:10.5px/1 var(--ui);pointer-events:none;text-anchor:middle}
.elab.on{fill:#bdf0e8}
.elab.dim{opacity:.12}
.elab.near{opacity:0}
.ed:hover .elab{opacity:1}
.ed:hover .edge{stroke:#8fd6cd}
.node{cursor:pointer}
.node circle{stroke:var(--field);stroke-width:2}
.node.concept circle{fill:none;stroke-dasharray:2.5 2.5;stroke-width:1.4}
.node text{fill:var(--field-ink);font:12px/1 var(--ui);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--field);stroke-width:3px;stroke-linejoin:round}
.node.sm text{font-size:11px;fill:var(--field-muted)}
.node.dim{opacity:.2}
.node.sel circle{stroke:#fff;stroke-width:2.5}
.hint{position:absolute;left:14px;bottom:12px;color:var(--field-muted);font-size:12.5px;pointer-events:none}
.back{position:absolute;left:12px;top:12px;background:var(--field-2);color:var(--field-ink);border:1px solid var(--field-line);border-radius:8px;padding:6px 12px;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:10px 2px 0;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.legend .ring{background:none;border:1.4px dashed var(--muted)}

/* ---------- inspector ---------- */
.insp{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:18px;position:sticky;top:14px;max-height:calc(100vh - 40px);overflow:auto}
.insp .empty{color:var(--muted);font-size:14.5px}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:99px;color:#fff;letter-spacing:.02em}
.tag.concept{background:none;border:1px dashed var(--muted);color:var(--muted)}
.insp h2{font:600 20px/1.25 var(--ui);margin:8px 0 2px}
.sub{font-size:13px;color:var(--muted);margin:0 0 12px}
.sub a{word-break:break-all}
.claim{border-top:1px solid var(--line);padding:11px 0}
.claim:first-of-type{border-top:0}
.triple{font-size:14.5px;line-height:1.45}
.triple b{font-weight:600}
.pred{color:var(--accent);font-weight:600}
.ev{font:14px/1.6 var(--read);color:var(--muted);border-left:2px solid var(--line);padding-left:11px;margin:6px 0 0}
.where{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.where button{color:var(--accent);text-decoration:underline;font-size:12px}
.chip{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;margin:0 4px 4px 0;background:var(--paper)}
.insp h3{font:600 12.5px/1 var(--ui);color:var(--muted);letter-spacing:.04em;margin:16px 0 7px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:34px 0 0;flex-wrap:wrap}
.tabs button{padding:10px 15px;font-size:14.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.pane{padding-top:18px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.row{border-bottom:1px solid var(--line);padding:12px 0}
.row:last-child{border-bottom:0}
.sect{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px;overflow:hidden}
.sect>summary{padding:13px 16px;cursor:pointer;font-size:14.5px;display:flex;gap:14px;align-items:baseline;justify-content:space-between}
.sect>summary>span:last-child{white-space:nowrap;flex-shrink:0}
.sect>summary::marker{color:var(--muted)}
.sect .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.sect .body p{font:16px/1.7 var(--read);max-width:74ch}
.sect .sum{font-size:14px;color:var(--muted);max-width:74ch;margin:12px 0 0}
.stype{font-size:12px;color:var(--muted);text-transform:lowercase}
mark{background:#ffe9a8;color:var(--ink);border-radius:3px;padding:0 2px}
.fig{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:16px;margin-bottom:12px}
.fig h4{margin:0 0 6px;font-size:16px}
.fig .cap{font:15px/1.65 var(--read);max-width:74ch;margin:0}
.flag{border:1px solid var(--line);border-left:3px solid var(--t-DRUG);border-radius:8px;background:var(--card);padding:10px 14px;margin-bottom:8px;font-size:14px}
.flag b{display:block;font-size:12.5px;color:var(--t-DRUG)}
.note{font-size:13.5px;color:var(--muted);max-width:76ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

"T. annulata-infected leukocytes", "ok": "tannulatainfectedleukocytes", "ev": "reduction in proliferation in METTL3-overexpressing T. annulata-infected leukocytes", "sec": "article-10-1016-j-bj-2025-100828-sec4-p6", "st": "discussion"}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p6-r4", "s": "m6A", "sk": "m6a", "p": "raises", "o": "questions regarding regulatory influence", "ok": "questionsregardingregulatoryinfluence", "ev": "raises questions regarding the potential regulatory influence of m6A", "sec": "article-10-1016-j-bj-2025-100828-sec4-p6", "st": "discussion"}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p7-r0", "s": "m6A", "sk": "m6a", "p": "regulates", "o": "E2F4", "ok": "e2f4", "ev": "the regulatory role of m6A on E2F4 expression", "sec": "article-10-1016-j-bj-2025-100828-sec4-p7", "st": "discussion"}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p7-r1", "s": "HIF-1α", "sk": "hif1α", "p": "regulates", "o": "WTAP", "ok": "wtap", "ev": "HIF-1α known to regulate m6A modulators, especially WTAP", "sec": "article-10-1016-j-bj-2025-100828-sec4-p7", "st": "discussion"}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p7-r2", "s": "HIF-1α", "sk": "hif1α", "p": "regulates", "o": "YTHDF1", "ok": "ythdf1", "ev": "HIF-1α known to regulate m6A modulators, especially YTHDF1", "sec": "article-10-1016-j-bj-2025-100828-sec4-p7", "st": "discussion"}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p8-r0", "s": "m6A", "sk": "m6a", "p": "modifies", "o": "ADAM19", "ok": "adam19", "ev": "Identifying ADAM19 as m6A-modified is particularly captivating.", "sec": "article-10-1016-j-bj-2025-100828-sec4-p8", "st": "discussion"}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p8-r1", "s": "m6A", "sk": "m6a", "p": "influences", "o": "ADAM19 expression", "ok": "adam19expression", "ev": "If m6A does indeed influence ADAM19 expression, as the METTL3 overexpression suggests.", "sec": "article-10-1016-j-bj-2025-100828-sec4-p8", "st": "discussion"}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p8-r2", "s": "m6A", "sk": "m6a", "p": "could shape", "o": "the spread of Theileria-transformed leukocytes", "ok": "thespreadoftheileriatransformedleukocytes", "ev": "m6A could potentially shape the spread of Theileria-transformed leukocytes.", "sec": "article-10-1016-j-bj-2025-100828-sec4-p8", "st": "discussion"}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p9-r0", "s": "m6A", "sk": "m6a", "p": "regulates", "o": "ADAM19", "ok": "adam19", "ev": "m6A in regulating ADAM19 expression in Theileria-infected leukocytes", "sec": "article-10-1016-j-bj-2025-100828-sec4-p9", "st": "discussion"}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p9-r1", "s": "m6A", "sk": "m6a", "p": "influences", "o": "ADAM19 expression", "ok": "adam19expression", "ev": "if m6A does indeed influence ADAM19 expression", "sec": "article-10-1016-j-bj-2025-100828-sec4-p9", "st": "discussion"}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p9-r2", "s": "m6A", "sk": "m6a", "p": "shapes", "o": "spread of Theileria-transformed leukocytes", "ok": "spreadoftheileriatransformedleukocytes", "ev": "m6A could potentially shape the spread of Theileria-transformed leukocytes", "sec": "article-10-1016-j-bj-2025-100828-sec4-p9", "st": "discussion"}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p10-r0", "s": "m6A", "sk": "m6a", "p": "associated with", "o": "Theileria annulata", "ok": "theileriaannulata", "ev": "the role of m6A modifications in the host-parasite interaction during Theileria annulata infection.", "sec": "article-10-1016-j-bj-2025-100828-sec4-p10", "st": "discussion"}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p10-r1", "s": "m6A", "sk": "m6a", "p": "associated with", "o": "tropical theileriosis", "ok": "tropicaltheileriosis", "ev": "the direct implications for tropical theileriosis, the involvement of m6A methylation as a significant factor.", "sec": "article-10-1016-j-bj-2025-100828-sec4-p10", "st": "discussion"}], "sections": [{"id": "article-10-1016-j-bj-2025-100828-sec1-p0", "n": 0, "type": "introduction", "title": "Introduction", "text": "Theileria annulata is an intracellular protozoan and a member of the phylum Apicomplexa. T. annulata, a tick-borne hemoparasite [1], causes leukoproliferative diseases [2] in cattle, commonly known as tropical theileriosis. Theileria parasites have significant impacts on both animal and human welfare. Uniquely, they can transform their host cells by profoundly hijacking their signaling cascades [3], leading to cancer-like phenotype characterized by immortalization, hyper-proliferation, and aggressive dissemination. However, dissemination can be attenuated by multiple in vitro passages [4]. Theileria parasites are recognized as master manipulators of their host cells, as reviewed in [5]. They modify host gene expression through both post-transcriptional and post-translational mechanisms to support their development [6].", "figs": [], "ents": ["apicomplexa", "leukoproliferativediseases", "theileriaannulata", "tropicaltheileriosis"], "summary": "This introduction section from the article discusses Theileria annulata, its classification as an intracellular protozoan, its role as a tick-borne hemoparasite causing tropical theileriosis in cattle, and its ability to transform host cells by hijacking signaling pathways."}, {"id": "article-10-1016-j-bj-2025-100828-sec1-p1", "n": 1, "type": "introduction", "title": "Introduction", "text": "They modify host gene expression through both post-transcriptional and post-translational mechanisms to support their development [6]. Epigenetic regulation, which encompasses histone modifications, DNA modifications, and non-coding RNAs, plays pivotal roles in gene expression control [7] — influencing cell homeostasis, differentiation, and development [8]. Additionally, an emerging epigenetic perspective suggests similar chemical modification processes on both mRNA and other RNA types [9]. While epigenetic alterations of DNA and chromatin are studied across a spectrum of organisms, including parasitic protists and mammals, the 'epitranscriptome,' notably reversible RNA modifications [10], remains relatively unexplored except in select mammalian species and some model organisms [8].", "figs": [], "ents": ["theileriaannulata"], "summary": "This introduction section from the article outlines the mechanisms by which epitranscriptomic modifications impact host gene expression and their significance in regulating cellular processes relevant to Theileria annulata infection."}, {"id": "article-10-1016-j-bj-2025-100828-sec1-p2", "n": 2, "type": "introduction", "title": "Introduction", "text": "While epigenetic alterations of DNA and chromatin are studied across a spectrum of organisms, including parasitic protists and mammals, the 'epitranscriptome,' notably reversible RNA modifications [10], remains relatively unexplored except in select mammalian species and some model organisms [8]. N 6-methyladenosine (m6A) stands out as a predominant, reversible modification found on eukaryotic mRNA [11]. The relative abundance of m6A in mRNA transcripts impacts RNA processes such as splicing [12], nuclear export [13], RNA degradation [14] and translation [15]. Furthermore, m6A plays a crucial role in several biological operations, including the DNA damage response [16], determination of cell fate [17], innate immunity [18] and tumorigenesis, as reviewed in [19].", "figs": [], "ents": ["epitranscriptome", "m6a", "mammals", "n6methyladenosine", "parasiticprotists"], "summary": "This introduction section from Malak Haidar's 2025 article discusses the limited exploration of the 'epitranscriptome,' particularly focusing on reversible RNA modifications like N 6-methyladenosine (m6A) in various organisms, including parasitic protists."}, {"id": "article-10-1016-j-bj-2025-100828-sec1-p3", "n": 3, "type": "introduction", "title": "Introduction", "text": "Furthermore, m6A plays a crucial role in several biological operations, including the DNA damage response [16], determination of cell fate [17], innate immunity [18] and tumorigenesis, as reviewed in [19]. m6A RNA modifications are essential in numerous biological activities [20-24]. The presence and extent of RNA methylation vary across cell types, affecting specific mRNA targets, methylation intensity, and site selection. Intriguingly, m6A peaks can aggregate in distinct regions, serving various biological functions [25].", "figs": [], "ents": ["cellfatedetermination", "dnadamageresponse", "innateimmunity", "m6a", "tumorigenesis"], "summary": "This introduction section from Malak Haidar's 2025 article discusses the significance of m6A RNA modifications in biological processes such as DNA damage response, cell fate determination, innate immunity, and tumorigenesis, highlighting their role in cellular functions."}, {"id": "article-10-1016-j-bj-2025-100828-sec1-p4", "n": 4, "type": "introduction", "title": "Introduction", "text": "Intriguingly, m6A peaks can aggregate in distinct regions, serving various biological functions [25]. m6A methyltransferase complexes oversee all m6A mRNA modifications. Central to the complex is a heterodimer comprising two writer-proteins: METTL3 and METTL14. METTL3 is the catalytic core, while METTL14 provides structural support. WTAP (Wilms' Tumor 1-Associating Protein) stabilizes this core. RNA-Binding Motif protein 15 (RBM15) assists in guiding the complex to its targets. Conversely, \"erasers\" such as the fat mass and obesity-associated protein (FTO) and alkB homolog 5 (ALKBH5) function as demethylases, removing m6A marks. Several m6A-binding proteins, including YTHDF1–3 and YTHDC1, are identified as m6A \"readers\" [26-29]. YTH domain family proteins might interact with unique subsets of m6A sites, leading to diverse gene expression outcomes [30].", "figs": [], "ents": ["mettl14", "mettl3", "rbm15", "theileriaannulata", "wtap"], "summary": "This introduction section from a study on Theileria annulata discusses the role of m6A methyltransferase complexes, highlighting the functions of METTL3, METTL14, and WTAP in m6A mRNA modifications relevant to host-parasite interactions."}, {"id": "article-10-1016-j-bj-2025-100828-sec1-p5", "n": 5, "type": "introduction", "title": "Introduction", "text": "YTH domain family proteins might interact with unique subsets of m6A sites, leading to diverse gene expression outcomes [30]. Our study seeks to discern the influence of parasite infection on host cell mRNA m6A modifications using T. annulata-infected leukocytes. We also aim to understand the biological significance of m6A modifications in the parasite-host interaction dynamics. By employing transcriptome-wide high-throughput deep m6A-seq and the MACS2 algorithm (Model-Based Analysis of ChIP-Seq), we identified various mRNA methylation patterns. Additionally, we highlighted the unique characteristics of specific and shared methylations in the virulent phenotype induced by Theileria infection, modulating m6A levels through CRISPR-CAS9-mediated activation technologies.", "figs": [], "ents": ["leukocytes", "m6a", "mrna", "theileriaannulata", "ythdomainfamilyproteins"], "summary": "This introduction section from Malak Haidar's 2025 BJ article explores the role of YTH domain family proteins in m6A modifications of host cell mRNA in the context of Theileria annulata infection, highlighting implications for gene expression and host-parasite dynamics."}, {"id": "article-10-1016-j-bj-2025-100828-sec2-p0", "n": 6, "type": "methods", "title": "Materials and Methods", "text": "Cell Culture: BL20 [31], TBL20 B lymphocytes, and Ode macrophages [32] were cultured in RPMI 1640 medium supplemented with 2 mM l-glutamine (Lonza, cat. no. 12-702F), 10 mM Hepes (Lonza, cat. no. 17-737E), 10% heat-inactivated FBS (Gibco, cat. no. 10082147), 100 units/mL of Penicillin, 100 μg/mL of streptomycin (Lonza, cat. no. 17-602E), and 10 mM b-mercaptoethanol (Sigma-Aldrich, cat. no. M6250) BL20/TBL20. The virulent (V) hyper-disseminating Ode cell line was utilized at passages 53–71, while its attenuated (A) counterpart was at passages 309–317. Vm pertains to virulent macroschizont-infected macrophages cultivated at 41°C (instead of 37°C) for 4-6 days, inducing macroschizonts to develop into merozoites (Mero). During this period, host cell proliferation stops. For pharmacological inhibition of HIF-1α, Theileria-infected cells were treated with 100 μM of PX478 (MedKoo Biosciences) for up to 16 h.", "figs": [], "ents": ["bl20", "bmercaptoethanol", "fbs", "hepes", "lglutamine", "ode", "rpmi1640", "tbl20"], "summary": "This Materials and Methods section from the article details the cell culture conditions for BL20, TBL20 B lymphocytes, and Ode macrophages, including the specific media components and supplements used for optimal growth."}, {"id": "article-10-1016-j-bj-2025-100828-sec2-p1", "n": 7, "type": "methods", "title": "Materials and Methods", "text": "For pharmacological inhibition of HIF-1α, Theileria-infected cells were treated with 100 μM of PX478 (MedKoo Biosciences) for up to 16 h. Cell Counting and ATP Assay: To count the number of cells, we employed the TC20 automated cell counter from BioRad. We ensured the cell concentration remained consistent at approximately 1 to 2 × 10ˆ5 cells/mL. The TC20 cell counter quickly provides a comprehensive cell count (with or without the aid of trypan blue staining) and evaluates cell viability using the trypan blue exclusion method. For assessing cell viability, we utilized the ATPlite Luminescence Assay (PerkinElmer). This assay offers a uniform method to determine the number of viable cells in a culture by measuring the ATP content, indicative of metabolically active cells. We conducted all experiments three times independently, each in duplicate. Error bars depict the standard error of the mean (SEM) across the three biological replicates.", "figs": [], "ents": ["biorad", "hif1α", "px478", "theileriaannulata", "trypanblue"], "summary": "This Materials and Methods section from Malak Haidar's 2025 study details the pharmacological inhibition of HIF-1α in Theileria-infected cells and outlines the procedures for cell counting and ATP assay to ensure consistent cell concentration."}, {"id": "article-10-1016-j-bj-2025-100828-sec2-p2", "n": 8, "type": "methods", "title": "Materials and Methods", "text": "Error bars depict the standard error of the mean (SEM) across the three biological replicates. Western Blot Analysis: After specific treatments, cells were harvested and lysed using a buffer containing Hepes 20 mM (pH 8), NaCl 150 mM, EDTA 2 mM, Nonidet P40 1%, SDS 0.1%, Sodium deoxycholate 0.5% with protease inhibitors (Complete mini EDTA free, Roche) and phosphatase (PhosSTOP, Roche). Lysates were centrifuged at 13,000 rpm for 15 min at 4°C, collecting the supernatants. Proteins were separated using SDS-PAGE, transferred to a nitrocellulose membrane (Protran, Whatman) at 30V overnight at 4°C, and blocked with 4% skim milk for 1 h. The antibodies used were anti-HIF-1α (Abcam, ab2185), anti-METTL3 (SAB2104747, Sigma Aldrich) and anti-actin (I-19, Santa Cruz Biotechnology).", "figs": [], "ents": ["completeminiedtafree", "edta", "hepes", "nacl", "nonidetp40", "phosstop", "sds", "sodiumdeoxycholate"], "summary": "This Materials and Methods section from the study by Malak Haidar details the Western Blot Analysis procedure, including cell harvesting and lysis using specific buffers and protease inhibitors for evaluating epitranscriptomic hallmarks in leukocytes."}, {"id": "article-10-1016-j-bj-2025-100828-sec2-p3", "n": 9, "type": "methods", "title": "Materials and Methods", "text": "The antibodies used were anti-HIF-1α (Abcam, ab2185), anti-METTL3 (SAB2104747, Sigma Aldrich) and anti-actin (I-19, Santa Cruz Biotechnology). Transient Transfection: Macrophages underwent electroporation using the Nucleofector system (Amaxa Biosystems). Approximately 5 x 105 cells were suspended in 100 μL of Nucleofector V solution mix (Lonza, cat. no. VCA-1003) with 2 μg of METTL3 (Santa Cruz Biotechnologies, cat. no. sc-437359-ACT). Alternatively, a negative control CRISPR activation plasmid (sc-437275) was used for nucleofection using the T-O17 program. Post-transfection, cells were reintroduced into fresh complete medium and incubated at 37°C with 5% CO 2.", "figs": [], "ents": ["actin", "crispr", "hif1α", "mettl3", "nucleofector", "nucleofectorv"], "summary": "This Materials and Methods section from the study details the antibodies used and the transient transfection process for macrophages, including the specific electroporation technique and reagents involved."}, {"id": "article-10-1016-j-bj-2025-100828-sec2-p4", "n": 10, "type": "methods", "title": "Materials and Methods", "text": "Post-transfection, cells were reintroduced into fresh complete medium and incubated at 37°C with 5% CO 2. Matrigel Chamber Assay: Ode macrophage dissemination capacity was evaluated in vitro using matrigel migration chambers. The assay was executed as per the Culturex instructions (Trevigen, cat. no. 3482-096-K). Following 24 h of incubation at 37°C, each top chamber well was rinsed once. Afterward, the top chamber was returned to the receiver plate, and 100 μL of cell dissociation solution AM was added to the lower chamber. This was followed by a 37°C incubation for 1 h with fluorescently labeled cells for dissociation from the membrane, before reading at wavelengths of 485 nm excitation and 520 nm emission.", "figs": [], "ents": [], "summary": "This Materials and Methods section from the study details the procedures followed for cell post-transfection and the evaluation of macrophage dissemination capacity using a matrigel migration assay."}, {"id": "article-10-1016-j-bj-2025-100828-sec2-p5", "n": 11, "type": "methods", "title": "Materials and Methods", "text": "This was followed by a 37°C incubation for 1 h with fluorescently labeled cells for dissociation from the membrane, before reading at wavelengths of 485 nm excitation and 520 nm emission. RNA Extraction: Cells were cultivated in triplicate at a density of 2.5 x 105 cells/ml. RNA was extracted using the PureLink RNA Mini Kit (Life Technologies, cat. no. 12183018A) as per the manufacturer's guidelines. The RNA's quality was assessed using a Bioanalyzer 2100, and quantified with Qubit (Invitrogen, cat. no. Q10210).", "figs": [], "ents": ["bioanalyzer2100", "invitrogen", "lifetechnologies", "purelinkrnaminikit", "qubit"], "summary": "This Materials and Methods section from Malak Haidar's study details the incubation procedure for fluorescently labeled cells and outlines the RNA extraction process using the PureLink RNA Mini Kit."}, {"id": "article-10-1016-j-bj-2025-100828-sec2-p6", "n": 12, "type": "methods", "title": "Materials and Methods", "text": "Q10210). qRT-PCR: Total RNA was reverse transcribed with the High-Capacity cDNA Reverse Transcription Kit (Applied Biosystems, cat. no. 4368814). Real-time PCR involved a cDNA template, Fast SYBR Green Master Mix, and forward and reverse primers. The PCR was executed on the 7500 HT Fast Real-Time PCR System (Applied Biosystems). GAPDH served as a reference gene, and results were evaluated via the 2 −ΔΔCT method with three biological replicates.", "figs": [], "ents": ["7500htfastrealtimepcrsystem", "appliedbiosystems", "fastsybrgreenmastermix", "gapdh", "highcapacitycdnareversetranscriptionkit", "theileriaannulata"], "summary": "This Materials and Methods section from Malak Haidar's 2025 article details the qRT-PCR procedure used for analyzing RNA from Theileria annulata-infected leukocytes, including reagents and equipment employed for the transcription and amplification processes."}, {"id": "article-10-1016-j-bj-2025-100828-sec2-p7", "n": 13, "type": "methods", "title": "Materials and Methods", "text": "GAPDH served as a reference gene, and results were evaluated via the 2 −ΔΔCT method with three biological replicates. Cell Cycle Analysis using Flow Cytometry: Theileria-infected macrophages, transfected with METTL3 CRISPR activation or a negative control plasmid, were seeded into 6-well plates and cultured for 48 h. Subsequently, cells were centrifuged and rinsed twice with cold PBS before being fixed in 70% pre-chilled ethanol overnight at -20°C. After fixation, cells were washed again with cold PBS, then stained with a solution containing PI (50 μg/mL) and RNase A (100 μg/mL), for 30 min at 4°C, protected from light. The stained cells were then analyzed using a flow cytometer (BD LSR Fortessa). Cell populations in the sub-G1 (G0), G1, S, and G2/M phases were categorized and analyzed based on their DNA content using the BD FACSDiva™ Software (BD Biosciences).", "figs": [], "ents": ["gapdh", "mettl3", "pi", "theileriaannulata"], "summary": "This Materials and Methods section from the study describes the use of GAPDH as a reference gene and outlines the cell cycle analysis of Theileria-infected macrophages, detailing the transfection process and cell preparation for flow cytometry."}, {"id": "article-10-1016-j-bj-2025-100828-sec2-p8", "n": 14, "type": "methods", "title": "Materials and Methods", "text": "Cell populations in the sub-G1 (G0), G1, S, and G2/M phases were categorized and analyzed based on their DNA content using the BD FACSDiva™ Software (BD Biosciences). Quantitation of m6A Levels: m6A modifications in RNA samples from Theileria-infected leukocytes were quantified using the EpiQuik™ m6A RNA Methylation Quantification Kit (EpiGentek, P-9005-96). In this procedure, total RNA is immobilized onto strip wells using an RNA high-binding solution. The presence of m6A is identified using a specific N6-methyladenosine capture antibody followed by a detection antibody. The resulting signal is amplified and subsequently quantified colorimetrically by measuring the absorbance at a wavelength of 450 nm using a microplate spectrophotometer.", "figs": [], "ents": ["bdfacsdiva™software", "epiquik™m6arnamethylationquantificationkit", "m6a", "theileriaannulata"], "summary": "This Materials and Methods section from the study by Malak Haidar describes the analysis of cell population phases and the quantification of m6A modifications in RNA from Theileria-infected leukocytes using specific software and a methylation quantification kit."}, {"id": "article-10-1016-j-bj-2025-100828-sec2-p9", "n": 15, "type": "methods", "title": "Materials and Methods", "text": "The resulting signal is amplified and subsequently quantified colorimetrically by measuring the absorbance at a wavelength of 450 nm using a microplate spectrophotometer. MeRIPseq and Data Analysis: Total RNA was isolated from Theileria-infected leukocytes and assessed for quality. mRNA was enriched using EpiQuik CUT&RUN m6A RNA Enrichment (MeRIP) Kit (EpiGentek, P-9018) as per the manufacturer’s instructions. Briefly, RNA sequences in both ends of the target m6A-containing regions are cleaved/removed, and the target m6A-containing fragments are pulled down using a beads-bound m6A capture antibody. The enriched RNA is then released, purified, and eluted. RNAseq libraries were constructed with Truseq stranded RNA LT kit (Illumina) as per the manufacturer and sequencing was performed on an Illumina HiSeq 4000 system. RNA-Seq read were trimmed with trimmomatic [33] and first mapped against the human genome (hg38) [34] using bowtie2 [35]. With the samtools and bedtools suites (PMID: 19505943; PMID: 20110278), unmapped reads were retrieved and subsequently mapped against the cow genome (Btau_4.6.1) [36]. Methylated regions were predicted with the callpeak function in macs2 (https://github.com/macs3-project/MACS) [37] using the immunoprecipitated and control data. Differentially expressed genes were determined from the control data using Deseq2 [38]. The raw sequencing datasets generated in this study are available in the European Nucleotide Archive (ENA) with the following accession numbers: PRJEB72277.", "figs": [], "ents": ["epigentek", "epiquikcut&runm6arnaenrichment", "theileriaannulata"], "summary": "This Materials and Methods section from the article outlines the colorimetric quantification of signals and describes the MeRIPseq process for isolating and enriching mRNA from Theileria-infected leukocytes."}, {"id": "article-10-1016-j-bj-2025-100828-sec2-p10", "n": 16, "type": "methods", "title": "Materials and Methods", "text": "The raw sequencing datasets generated in this study are available in the European Nucleotide Archive (ENA) with the following accession numbers: PRJEB72277. Statistical analysis: Data are represented as mean values with their standard error of the mean (SEM). For comparisons involving two groups, an unpaired Student t-test was utilized. When comparing three or more groups, a one-way ANOVA was employed. A significance level of P<0.05 was established for all statistical assessments. The software used for these analyses was GraphPad Prism 9.", "figs": [], "ents": [], "summary": "This Materials and Methods section from the study details the availability of sequencing datasets and outlines the statistical analyses employed for data representation and comparisons among groups."}, {"id": "article-10-1016-j-bj-2025-100828-sec3-p0", "n": 17, "type": "results", "title": "T. annulata infection alters bovine mRNA methylation in host leukocytes", "text": "### T. annulata infection alters bovine mRNA methylation in host leukocytes\n\nTheileria parasites are recognized for altering the phenotype of host leukocytes, leading to uncontrolled proliferation, apoptosis resistance, and heightened invasiveness/dissemination [39 ]. While we, along with others, have pinpointed components of the disrupted transcriptomes in Theileria-infected macrophages and B-cells [40, 41], the capacity of the parasite to alter the mRNA methylome of its transformed host leukocyte remains unexplored.", "figs": [], "ents": ["bcells", "leukocytes", "macrophages", "mrna", "theileriaannulata"], "summary": "This Results section from the study outlines how T. annulata infection impacts mRNA methylation patterns in bovine host leukocytes, contributing to changes in cellular behavior such as proliferation and apoptosis resistance."}, {"id": "article-10-1016-j-bj-2025-100828-sec3-p1", "n": 18, "type": "results", "title": "T. annulata infection alters bovine mRNA methylation in host leukocytes", "text": "While we, along with others, have pinpointed components of the disrupted transcriptomes in Theileria-infected macrophages and B-cells [40, 41], the capacity of the parasite to alter the mRNA methylome of its transformed host leukocyte remains unexplored. To gain a comprehensive insight into m6A mRNA methylation patterns across various T. annulata-infected cell lines, we used the ELISA assay to measure m6A RNA methylation levels. We extracted total RNA from virulent (V) and attenuated (A) macrophages, merozoite-producing macrophages (Vm), and infected B-cells (TBL20), as well as their non-infected counterparts (BL20) for this assay. Intriguingly, merozoite-producing macrophages (Vm and Am) exhibited higher m6A percentages than both virulent and attenuated macrophages (Figure. 1 Theileria-infected B cells (TBL20) had a reduced m6A percentage compared to their uninfected BL20 counterparts (Figure. 1 A, right).", "figs": ["fig1"], "ents": ["bcells", "m6a", "macrophages", "mrna", "tbl20", "theileriaannulata"], "summary": "This Results section from the study by Malak Haidar explores how T. annulata infection influences mRNA methylation in bovine leukocytes, highlighting a gap in understanding the parasite’s impact on host transcriptomes."}, {"id": "article-10-1016-j-bj-2025-100828-sec3-p2", "n": 19, "type": "results", "title": "T. annulata infection alters bovine mRNA methylation in host leukocytes", "text": "1 A, right). To further understand the role of m6A methylation as an epigenetic marker in T. annulata-infected leukocytes, we conducted transcriptome-wide m6A-seq (MeRIP-seq) analyses. This method detects methylated regions as peaks in transcript coverage by comparing immunoprecipitated RNA to input RNA. Our assessment of the influence of m6A methylation' on mRNA expression found no difference in expression levels between methylated and non-methylated mRNAs (Figure.1B). Notably, while ELISA assays showed increased m6A percentages in merozoite-producing macrophages (Vm) compared to virulent (V) and attenuated (A) macrophages, the MeRIP-seq analyses indicated higher m6A peaks in proliferating V and A macrophages than in proliferation arresting Vm. However, this high level is not statistically significant. It's important to highlight that ELISA offers a bulk measurement of m6A modification, representing an average m6A level across an entire RNA sample. In comparison, MeRIP-seq delivers a detailed, transcriptome-wide view of m6A sites, ensuring precise detection and quantification of m6A at specific sites throughout the transcriptome. This distinction could account for the observed discrepancy in our results. However, both techniques identified clear differences in m6A levels between proliferating V/A macrophages and proliferation-arresting Vm. For further validation, we analyzed the expression profiles of methyltransferases, writers, demethylases, and readers, specifically mettl3, wtap, alkbh5, ythdc1, ythdf1, and ythdf3. This was executed between BL20 and TBL20 and solely in virulent versus Vm, as there was no discernible difference in m6A percentages between virulent and attenuated macrophages. Remarkably, mRNA expression levels of methyltransferases, demethylases, and readers were elevated in merozoites relative to virulent macrophages (Figure 2 Theileria-infected B cells (TBL20) when compared to the non-infected BL20 (Figure. 2 B).", "figs": ["fig2"], "ents": ["m6a", "mrna", "theileriaannulata", "vm"], "summary": "This Results section from the study explores how T. annulata infection impacts m6A methylation patterns in bovine host leukocytes, utilizing m6A-seq analyses to assess changes in mRNA expression levels."}, {"id": "article-10-1016-j-bj-2025-100828-sec3-p3", "n": 20, "type": "results", "title": "Association Between m6A Methylation and Differential Gene Expression", "text": "2 B). ### Association Between m6A Methylation and Differential Gene Expression\n\nTo explore the potential relationships between m6A methylation and differential gene expression (DE), our analysis began by comparing different gene sets. In the V vs. A comparison, of the 4161 genes evaluated, 232 were found to be differentially expressed in either direction, representing approximately 10.8% of the total. However, when narrowing our focus to just those genes with m6A marks, 314 out of the 2785 genes showed differential expression, translating to approximately 11.3%. Utilizing a binomial distribution test to ascertain the probability of observing 314 DE genes out of 2785 (given a baseline DE probability of 0.108 derived from the entire gene set), we arrived at a p-value of 0.2252. This result indicates that the frequency of differential expression in genes with m6A modifications does not significantly deviate from what would be expected based on the overall gene set.", "figs": [], "ents": ["genes", "leukocytes", "m6a", "theileriaannulata"], "summary": "This Results section from the study investigates the relationship between m6A methylation and differential gene expression, revealing that 232 out of 4161 evaluated genes display significant differential expression in Theileria annulata-infected leukocytes."}, {"id": "article-10-1016-j-bj-2025-100828-sec3-p4", "n": 21, "type": "results", "title": "Association Between m6A Methylation and Differential Gene Expression", "text": "This result indicates that the frequency of differential expression in genes with m6A modifications does not significantly deviate from what would be expected based on the overall gene set. In stark contrast, the comparison of V vs. Vm and V vs. A returned p-values of 0.0222 and 0.00414, respectively. These Figures suggest that, in these comparisons, genes exhibiting m6A peaks are differentially expressed more often than one would expect by chance or based on the probabilities inherent to the entire gene set (Figure 3", "figs": [], "ents": ["a", "leukocytes", "m6a", "theileriaannulata", "v", "vm"], "summary": "This results section from Malak Haidar's study discusses the association of m6A methylation with differential gene expression in Theileria annulata-infected leukocytes, highlighting significant findings from specific gene comparisons."}, {"id": "article-10-1016-j-bj-2025-100828-sec3-p5", "n": 22, "type": "results", "title": "Association Between m6A Methylation and Differential Gene Expression", "text": "These Figures suggest that, in these comparisons, genes exhibiting m6A peaks are differentially expressed more often than one would expect by chance or based on the probabilities inherent to the entire gene set (Figure 3 Diving deeper, we sought to uncover any potential links between the presence of m6A in one sample and the up-regulation of genes in another, guided by the notion that methylation might suppress mRNA abundance. For the V vs A comparison, 218 out of the 4161 genes were found to be up-regulated in the A sample, which corresponds to roughly 5.24%. Among the 531 genes that were exclusively methylated in V, 29 (or about 5.46%) were up-regulated in A. The probability of witnessing 29 DE genes (those up-regulated specifically in V) out of 531, with an inherent up-regulation chance of 5.24%, yields a p-value of 0.436, suggesting no significant association. An analogous test, focusing on genes uniquely methylated in A that were up-regulated in V, produced a p-value of 0.744. The V vs Vm comparison (Figure. 3 A, middle panel) revealed no significant enrichment for genes uniquely marked with m6A in V that were up-regulated in Vm (p-value: 0.513). However, the reverse comparison, Vm vs V, highlighted an enrichment for genes marked exclusively with m6A in Vm that were up-regulated in V (p-value: 0.0163). Moreover, a marked enrichment was observed for genes uniquely bearing m6A marks in Vm and up-regulated in A (p-value: 0.0382) (Figure. 3 A, bottom panel).", "figs": [], "ents": ["m6a", "mrna", "theileriaannulata"], "summary": "This results section from the study explores the association between m6A methylation and differential gene expression in Theileria annulata-infected leukocytes, highlighting a correlation between m6A peaks and gene up-regulation."}, {"id": "article-10-1016-j-bj-2025-100828-sec3-p6", "n": 23, "type": "results", "title": "Association Between m6A Methylation and Differential Gene Expression", "text": "3 A, bottom panel). While the data might not present a conclusive picture, there's a suggestion that m6A methylation of mRNA by genes expressed in proliferation-arresting macrophages induced to produce merozoites might be associated with their down-regulation.", "figs": [], "ents": ["m6a", "macrophages", "merozoites", "mrna", "theileriaannulata"], "summary": "This results section from Malak Haidar's study explores the potential link between m6A methylation of mRNA and the down-regulation of genes in proliferation-arresting macrophages related to Theileria annulata infection."}, {"id": "article-10-1016-j-bj-2025-100828-sec3-p7", "n": 24, "type": "results", "title": "Association Between m6A Methylation and Differential Gene Expression", "text": "In our analysis, for both BL20 and TBL20 samples, we focused on the top 5% of genes showcasing the highest ratio of m6A modification relative to reference samples, postulating that this subset represents genes that undergo m6A methylation. Remarkably, considerable overlap was observed between these gene subsets, indicating that genes modified by m6A in BL20 are frequently modified similarly in TBL20. This observation aligns well with our previous approach.", "figs": [], "ents": ["bl20", "m6a", "tbl20"], "summary": "This results section from the study investigates the correlation between m6A methylation and gene expression in BL20 and TBL20 samples, highlighting a significant overlap in genes modified by m6A in both parasite-infected leukocyte types."}, {"id": "article-10-1016-j-bj-2025-100828-sec3-p8", "n": 25, "type": "results", "title": "Association Between m6A Methylation and Differential Gene Expression", "text": "This observation aligns well with our previous approach. Subsequently, we identified genes exclusively modified by m6A in either BL20 or TBL20, but not in both. For these distinct gene sets, we plotted the ratios of expression levels between TBL20 and BL20 reference samples. As visualized in the upper left section of (Figure. 3 B&C, genes exclusively modified by m6A in TBL20/TBL3 (depicted by the orange curve and labeled 'high m6A in TBL20/TBL3 only') manifest a noticeable skewness towards reduced TBL20/BL20 expression ratios. This has been annotated as ‘DOWN in TBL20/TBL3’ beneath the graph. However, an alternate interpretation could be an up-regulation in BL20/BL3. Conversely, genes solely modified by m6A in BL20 (represented by the blue curve) exhibited the opposing pattern. Intriguingly, this pattern suggests that genes undergoing m6A modification in TBL20/TBL3 tend to be down-regulated in TBL20/TBL3, while those modified in BL20/ BL3 mirror this down-regulation in BL20/ BL3. To quantitatively assess the differences in medians between the two distributions, we employed the Mann-Whitney U test, and the corresponding p-values have been provided on the plots for clarity. It's paramount to note that this is a broad observation, and individual genes might exhibit distinct behaviors.", "figs": [], "ents": ["bl20", "m6a", "tbl20", "tbl3", "theileriaannulata"], "summary": "This results section from the study explores the association between m6A methylation and differential gene expression in Theileria annulata-infected leukocytes, highlighting the identification of genes uniquely modified by m6A in different sample groups."}, {"id": "article-10-1016-j-bj-2025-100828-sec3-p9", "n": 26, "type": "results", "title": "m6A modification enhances the proliferation of Theileria-infected leukocytes", "text": "It's paramount to note that this is a broad observation, and individual genes might exhibit distinct behaviors. ### m6A modification enhances the proliferation of Theileria-infected leukocytes\n\nTheileria can transform host leukocytes and induce their uncontrolled proliferation. Infection of BL20 B cells by T. annulata to give TBL20 increases B cell proliferation, whereas when T. annulata-infected macrophages (V) are induced to produce merozoites macrophages (Vm) proliferation arrests [42]. Observing that m6A levels rise in the more proliferative TBL20 B cells and decline in the arrested Vm macrophages, we postulated a correlation between m6A levels and host cell proliferative activity.", "figs": [], "ents": ["bl20", "m6a", "macrophages", "merozoites", "tbl20", "theileriaannulata", "v"], "summary": "This Results section from the study on Theileria annulata details how m6A modification promotes the proliferation of infected leukocytes, highlighting the impact of T. annulata on host B cell dynamics."}, {"id": "article-10-1016-j-bj-2025-100828-sec3-p10", "n": 27, "type": "results", "title": "m6A modification enhances the proliferation of Theileria-infected leukocytes", "text": "Observing that m6A levels rise in the more proliferative TBL20 B cells and decline in the arrested Vm macrophages, we postulated a correlation between m6A levels and host cell proliferative activity. To test this hypothesis, we overexpressed METTL3 in virulent macrophages and in infected TBL20 B cells using a CRISPR CAS9 activation (CRISPRa) system [43]. Using qRT-PCR and western blot analysis, we confirmed that transfection of Theileria-infected leukocytes with a METTL3-specific CRISPRa plasmid led to increased METTL3 expression (Figure 4 6 A in virulent macrophages (Figure. 4 A, right).", "figs": [], "ents": ["crispra", "crisprcas9", "leukocytes", "m6a", "mettl3", "tbl20", "theileriaannulata", "vm"], "summary": "This Results section from the 2025 BJ article details the correlation between m6A modification levels and the proliferation of Theileria-infected leukocytes, emphasizing experimental approaches to enhance METTL3 expression through CRISPRa in virulent macrophages and TBL20 B cells."}, {"id": "article-10-1016-j-bj-2025-100828-sec3-p11", "n": 28, "type": "results", "title": "m6A modification enhances the proliferation of Theileria-infected leukocytes", "text": "4 A, right). Subsequently, we assessed the consequences of increased m6A modification on host cell proliferation. Proliferation rates were determined through cell counting and viability using an adenosine triphosphate (ATP) bioluminescence assay. Importantly, METTL3 overexpression resulted in a significant decrease in proliferation of both T. annulata-infected macrophages and B20 cells (TBL20) (Figure. 4 B, left). In contrast, cells transfected with an empty CRISPRa plasmid showed no such change, highlighting the importance of m6A methylation in promoting host cell proliferation. The ATP bioluminescence results indicated that T. annulata-infected leukocytes, upon transfection with the METTL3 CRISPRa plasmid, displayed the same vitality compared to those transfected with the empty CRISPRa plasmid (Figure. 5 Figure. 4 C, left & Fig. S1)).", "figs": [], "ents": ["adenosinetriphosphate", "bl20", "m6a", "mettl3", "tbl20", "theileriaannulata"], "summary": "This Results section from the study investigates the effects of m6A modification on the proliferation of Theileria annulata-infected leukocytes, revealing that METTL3 overexpression significantly decreases their proliferation rates."}, {"id": "article-10-1016-j-bj-2025-100828-sec3-p12", "n": 29, "type": "results", "title": "m6A modification enhances the proliferation of Theileria-infected leukocytes", "text": "S1)). Acknowledging that host cell proliferation is pivotal in Theileria-mediated pathogenesis [44], we sifted through our Me-RIP dataset to identify m6A-modified bovine mRNAs transcribed by genes integral to G2 and G2/M phase modulation such as CDC2, CDK1, CCNB1, CCNB2, BUB1, BUB1B, and CDC25B,Cyclin B1,E2F4 [45, 46]. Among these, only the E2F transcription factor family member (E2F4) bore m6A modifications. Earlier research affirmed that E2F4 partly functions as a transcriptional catalyst, regulating the expression of cell cycle-associated genes [47]. Notably, our meRIP-seq dataset revealed heightened levels of methylated E2F4 mRNA relative to its non-methylated counterpart. To validate the hypothesis that m6A modification modulates E2F4 expression, we quantified E2F4 mRNA levels post METTL3 overexpression in virulent macrophages. E2F4 expression heightens in conjunction with rising m6A levels (Figure.4C, right). For more confirmation, we looked for genes known to be regulated by E2F4 in bovine cells [48, 49], but we could only identify four genes: SIRT5, mTOR, SREBP‐1c (gene is SREBF1), and Cyclin D1 (gene is CCND1). We indicated SIRT5, mTOR, and SREBP‐1c on a volcano plot (Fig. S2). None of these genes show significant differential gene expression (DGE), but they are all downregulated in Vm compared to V. We then examined a ChIP-Seq study from humans [50]. This study identified 16,246 peaks (putative E2F4 binding sites) in the hg18 genome. Using this annotation, we found that 4,739 human genes have peaks within their 250 bp upstream region. Of these, we identified 3,960 corresponding bovine genes in our RNA DEseq output. Upon examining these bovine genes, where the human version has an upstream putative E2F4 binding site, we observed that 43 are upregulated and 114 are downregulated. Over 72% of these DGE genes are downregulated (corresponding to the repressor activity of E2F4) compared to the rest of the DGE genes, of which only approximately 35% are downregulated. This finding is highly significant (attached, bottom plot) and suggests that genes potentially regulated by E2F4 are downregulated in Vm (Fig. S2). Collectively, these findings reinforce the notion that m6A modulates cell cycle dynamics via E2F4 mRNA modifications.", "figs": [], "ents": ["bub1", "ccnb1", "ccnb2", "cdc2", "cdk1", "e2f4", "m6a", "theileriaannulata"], "summary": "This Results section from Malak Haidar's study highlights the role of m6A modification in enhancing the proliferation of Theileria-infected leukocytes, focusing on specific bovine mRNAs related to cell cycle regulation."}, {"id": "article-10-1016-j-bj-2025-100828-sec3-p13", "n": 30, "type": "results", "title": "HIF-1α-promotes proliferation of Theileria-infected leukocytes by inducing m6A-RNA methylation", "text": "Collectively, these findings reinforce the notion that m6A modulates cell cycle dynamics via E2F4 mRNA modifications. ### HIF-1α-promotes proliferation of Theileria-infected leukocytes by inducing m6A-RNA methylation\n\nHIF-1α levels are significantly higher in attenuated macrophages than in their virulent counterparts, even after losing their tumorigenic phenotype [51]. Pharmacological inhibition of HIF-1α is found to prevent the proliferation of Theileria-infected macrophages [51]. Additionally, HIF-1α inhibition in T. annulata-infected B cells abolishes their ability to form colonies in soft agar, most likely due to growth arrest [52]. Importantly, HIF-1α has been shown to enhance the expression of WTAP leading to a change in m6A distribution and boosting cell proliferation in acute myeloid leukemia [53]. HIF-1α also directly binds to the promoter region of YTHDF1, regulating its transcription under hypoxic conditions in hepatocellular carcinoma [54].", "figs": [], "ents": ["e2f4", "hif1α", "m6a", "macrophages", "theileriaannulata"], "summary": "This Results section from the study by Malak Haidar discusses how HIF-1α influences the proliferation of Theileria-infected leukocytes through m6A-RNA methylation, highlighting higher levels in attenuated macrophages compared to virulent forms."}, {"id": "article-10-1016-j-bj-2025-100828-sec3-p14", "n": 31, "type": "results", "title": "HIF-1α-promotes proliferation of Theileria-infected leukocytes by inducing m6A-RNA methylation", "text": "HIF-1α also directly binds to the promoter region of YTHDF1, regulating its transcription under hypoxic conditions in hepatocellular carcinoma [54]. Considering our observations about the correlation of m6A RNA modification, as well as the function of HIF-1α in the proliferation of Theileria-infected leukocytes, we assumed that HIF-1α regulates the process of m6A RNA modification. To test this hypothesis, we first analyzed the HIF-1α levels in merozoite-producing macrophages (Vm) as well as virulent (V). We observed increased HIF-1α protein expression in Vm compared to virulent macrophages (Figure 5 A, left).", "figs": [], "ents": ["hepatocellularcarcinoma", "hif1α", "merozoiteproducingmacrophages", "theileriaannulata", "virulentmacrophages", "ythdf1"], "summary": "This Results section from the article discusses how HIF-1α regulates m6A-RNA methylation, highlighting its role in the proliferation of Theileria-infected leukocytes under hypoxic conditions."}, {"id": "article-10-1016-j-bj-2025-100828-sec3-p15", "n": 32, "type": "results", "title": "HIF-1α-promotes proliferation of Theileria-infected leukocytes by inducing m6A-RNA methylation", "text": "We observed increased HIF-1α protein expression in Vm compared to virulent macrophages (Figure 5 A, left). Subsequently, we used PX-478 to inhibit the HIF-1α signaling pathway in virulent macrophages and infected B cells (TBL20) and study its effect on the m6A RNA methylation state. The values of percent m6A in each sample were determined by ELISA assay and mRNA expression levels of writers and readers of the m6A complex were tested by qPCR. When HIF-1α is suppressed, the m6A percentage shown in infected macrophages as well as TBL20 is found to be upregulated. (Figure 5 A, right) Furthermore, this increase is in line with the WTAP, YTDHF1, and YTHDF3 up-regulation in both virulent macrophages and infected- BL20 (Figure. 6 6 A complex expression and thereby drives proliferative effects in Theileria-infected cells.", "figs": [], "ents": ["hif1α", "m6a", "px478", "tbl20", "theileriaannulata"], "summary": "This Results section from Malak Haidar's study examines the role of HIF-1α in promoting the proliferation of Theileria-infected leukocytes through m6A-RNA methylation, highlighting protein expression differences and experimental methods to analyze methylation levels."}, {"id": "article-10-1016-j-bj-2025-100828-sec3-p16", "n": 33, "type": "results", "title": "m6A Modulates Dissemination in Theileria -Transformed Leukocytes", "text": "6 6 A complex expression and thereby drives proliferative effects in Theileria-infected cells. ### m6A Modulates Dissemination in Theileria -Transformed Leukocytes\n\nADAMs (A Disintegrin And Metalloproteinase) are membrane-anchored proteins bearing structural similarities to snake venom disintegrins that play crucial roles in migration, adhesion, and both cell-cell and cell-matrix interactions (reviewed in [55]). In our m6A-seq dataset, ADAM19 is found to be m6A-modified and overexpression of METTL3 in T. annulata-infected macrophages leads to its upregulation (Figure 6 A).", "figs": [], "ents": ["adam19", "adams", "m6a", "mettl3", "theileriaannulata"], "summary": "This results section from the article discusses how m6A contributes to the proliferation and dissemination of Theileria-infected leukocytes through the modulation of membrane-anchored proteins like ADAMs involved in cellular interactions."}, {"id": "article-10-1016-j-bj-2025-100828-sec3-p17", "n": 34, "type": "results", "title": "m6A Modulates Dissemination in Theileria -Transformed Leukocytes", "text": "annulata-infected macrophages leads to its upregulation (Figure 6 A). Based on these findings, we proposed that m6A RNA methylation might influence the dissemination potential of infected macrophages. We employed Matrigel chamber assays, which revealed that METTL3 overexpression reinforces the ability of infected macrophages to migrate through a synthetic matrix (Figure. 6 B). Collectively, these results suggest that m6A modifications may enhance the dissemination ability of T. annulata-infected macrophages, potentially through the increased expression of ADAM19 mRNA.", "figs": [], "ents": ["ada", "m6a", "mettl3", "theileriaannulata"], "summary": "This Results section from a study on Theileria annulata explores how m6A RNA methylation impacts the migration abilities of infected macrophages, highlighting findings from Matrigel chamber assays regarding METTL3 overexpression."}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p0", "n": 35, "type": "discussion", "title": "Discussion", "text": "The impact of pathogens on host epigenetics offers invaluable insights into the complex interactions that underlie infection and disease progression. Among these, Theileria parasites, specifically transforming species such as T. annulata, excel at altering host cellular behavior. This capability is evident in pathological outcomes such as unchecked cellular proliferation and an increased resistance to apoptosis. Recent research has enriched our comprehension of the ways Theileria parasites reshape the transcriptomes of infected cells. Yet, the exploration of the epigenetic dimension — particularly T. annulata 's impact on mRNA methylation — remains a yet-to-be-unfolded area of study.", "figs": [], "ents": ["apoptosis", "theileriaannulata"], "summary": "This discussion section from Malak Haidar's 2025 article examines how Theileria annulata influences host epigenetics, highlighting its role in cellular behavior changes and contributing to disease progression."}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p1", "n": 36, "type": "discussion", "title": "Discussion", "text": "annulata 's impact on mRNA methylation — remains a yet-to-be-unfolded area of study. Utilizing ELISA assays revealed varying m6A levels across different T. annulata-infected cell lines. It's noteworthy that proliferation-arresting merozoite-producing macrophages exhibited unique methylation patterns compared to both proliferating virulent and attenuated macrophages. Additionally, m6A levels differ between the more proliferative Theileria-infected B cells (TBL20) and their uninfected counterparts, BL20.", "figs": [], "ents": ["bl20", "m6a", "tbl20", "theileriaannulata"], "summary": "This discussion section from Malak Haidar's 2025 article explores mRNA methylation variations in Theileria annulata-infected leukocytes, highlighting unique m6A patterns in different macrophage types and their potential implications for virulence and disease progression."}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p2", "n": 37, "type": "discussion", "title": "Discussion", "text": "Additionally, m6A levels differ between the more proliferative Theileria-infected B cells (TBL20) and their uninfected counterparts, BL20. In tandem with these findings, MeRIP-seq analyses shed light on detailed m6A methylation patterns across the transcriptome. While m6A peaks within genes displayed consistency, there was no clear correlation with mRNA expression levels. Interestingly, ELISA indicated a rise in m6A levels in merozoite-producing macrophages, a trend contradicted by the MeRIP-seq analysis. This disparity accentuates the distinct strengths of the two techniques: the overarching perspective of ELISA versus the nuanced detail of MeRIP-seq. These differences underscore the importance of employing a range of methodologies in epigenetics research to achieve a comprehensive understanding.", "figs": [], "ents": ["bcells", "bl20", "elisa", "m6a", "meripseq", "mrna", "tbl20", "theileriaannulata"], "summary": "This discussion section from the article examines the differences in m6A methylation levels between Theileria-infected B cells and uninfected cells, highlighting findings from MeRIP-seq analyses and the lack of correlation with mRNA expression levels."}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p3", "n": 38, "type": "discussion", "title": "Discussion", "text": "These differences underscore the importance of employing a range of methodologies in epigenetics research to achieve a comprehensive understanding. A closer examination of the relationship between m6A methylation and gene expression variability revealed compelling patterns. While comparisons between V and A infected macrophages showed no significant gene expression changes, the analyses of V vs. Vm and V vs. A presented a contrasting narrative. This data suggests a scenario where m6A modifications could influence gene expression in a context-specific manner.", "figs": [], "ents": ["a", "m6a", "theileriaannulata", "v", "vm"], "summary": "This discussion section from the study by Malak Haidar emphasizes the significance of diverse methodologies in epitranscriptomics and highlights patterns in m6A methylation's relationship with gene expression variability in Theileria annulata-infected leukocytes."}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p4", "n": 39, "type": "discussion", "title": "Discussion", "text": "This data suggests a scenario where m6A modifications could influence gene expression in a context-specific manner. Subsequent, the analysis aiming at associate m6A presence with upregulated gene expression yielded promising but inconclusive results. When examining genes enriched with m6A only in V and up-regulated in Vm, no correlation was detected. However, there was a correlation between genes that are m6A-enriched in Vm, and up-regulated in V, suggesting that methylation of genes in merozoites could result in their downregulation.", "figs": [], "ents": ["leukocytes", "m6a", "merozoites", "theileriaannulata"], "summary": "This discussion section from the article explores the implications of m6A modifications on gene expression in Theileria annulata-infected leukocytes, highlighting inconclusive results regarding correlations between m6A presence and upregulated gene expression."}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p5", "n": 40, "type": "discussion", "title": "Discussion", "text": "However, there was a correlation between genes that are m6A-enriched in Vm, and up-regulated in V, suggesting that methylation of genes in merozoites could result in their downregulation. Comparisons between BL20 and TBL20 highlighted a significant overlap in genes undergoing m6A methylation. This implies a consistent gene set that may be subject to such modifications, regardless of infection status. Delving deeper, some genes showed exclusive methylation in specific categories, pointing towards a potential role for m6A in downregulation of gene expression.", "figs": [], "ents": ["bl20", "tbl20", "theileriaannulata", "v", "vm"], "summary": "This discussion section from the study examines the correlation between m6A enrichment and gene expression in Theileria annulata-infected leukocytes, highlighting significant overlaps in gene methylation patterns across different infection states."}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p6", "n": 41, "type": "discussion", "title": "Discussion", "text": "Delving deeper, some genes showed exclusive methylation in specific categories, pointing towards a potential role for m6A in downregulation of gene expression. Furthermore, this research emphasizes the role of m6A methylation in modulating host cell proliferation during T. annulata infection. Often paralleled with DNA methylation regarding its regulatory significance, m6A might be a key factor driving the persistent proliferation of T. annulata-infected leukocytes. The observed reduction in proliferation in METTL3-overexpressing T. annulata-infected leukocytes accentuates the critical role of m6A in this setting. It also raises questions regarding the potential regulatory influence of m6A on E2F4 expression, a crucial component of the cell cycle, suggesting a layered control mechanism.", "figs": [], "ents": ["m6a", "mettl3", "theileriaannulata"], "summary": "This discussion section from the article examines the role of m6A methylation in downregulating gene expression and its significance in modulating host cell proliferation during T. annulata infection."}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p7", "n": 42, "type": "discussion", "title": "Discussion", "text": "It also raises questions regarding the potential regulatory influence of m6A on E2F4 expression, a crucial component of the cell cycle, suggesting a layered control mechanism. The proposed link between HIF-1α and m6A RNA methylation is indeed striking. With HIF-1α known to regulate m6A modulators, especially WTAP and YTHDF1, it introduces a novel perspective on the potential strategies’ pathogens might employ to manipulate host cells to favor growth. The convergence of epigenetic changes with hypoxic responses offers an integrated view of host-pathogen interactions, hinting at potential avenues for innovative treatments.", "figs": [], "ents": ["e2f4", "hif1α", "m6a", "theileriaannulata", "wtap", "ythdf1"], "summary": "This discussion section from Malak Haidar's article examines the regulatory role of m6A on E2F4 expression and its connection with HIF-1α in Theileria annulata-infected leukocytes, highlighting novel pathogen strategies."}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p8", "n": 43, "type": "discussion", "title": "Discussion", "text": "The convergence of epigenetic changes with hypoxic responses offers an integrated view of host-pathogen interactions, hinting at potential avenues for innovative treatments. Identifying ADAM19 as m6A-modified is particularly captivating, given its critical role in cell migration and adhesion. If m6A does indeed influence ADAM19 expression, as the METTL3 overexpression suggests, then m6A could potentially shape the spread of Theileria-transformed leukocytes, thereby affecting disease progression and intensity.", "figs": [], "ents": ["adam19", "m6a", "mettl3", "theileriaannulata"], "summary": "This discussion section from Malak Haidar's 2025 article explores the implications of epitranscriptomic modifications, particularly m6A on ADAM19, in relation to host-parasite interactions and potential therapeutic strategies against Theileria annulata infection."}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p9", "n": 44, "type": "discussion", "title": "Discussion", "text": "If m6A does indeed influence ADAM19 expression, as the METTL3 overexpression suggests, then m6A could potentially shape the spread of Theileria-transformed leukocytes, thereby affecting disease progression and intensity. However, it's important to recognize the study's constraints, as the molecular mechanisms responsible for the observed effects aren't fully understood. While the relationship between m6A levels and cellular activities is intriguing, a more profound understanding of the underlying mechanics is needed. Furthermore, translating these findings to real-world, in vivo scenarios — especially given the complexities associated with the host immune response and the parasite's life cycle — is yet to be fully established.", "figs": [], "ents": ["adam19", "m6a", "theileriaannulata"], "summary": "This discussion section from the article examines the potential role of m6A in regulating ADAM19 expression in Theileria-infected leukocytes and its implications for disease progression, while acknowledging the limitations in understanding the underlying molecular mechanisms."}, {"id": "article-10-1016-j-bj-2025-100828-sec4-p10", "n": 45, "type": "discussion", "title": "Discussion", "text": "Furthermore, translating these findings to real-world, in vivo scenarios — especially given the complexities associated with the host immune response and the parasite's life cycle — is yet to be fully established. In summary, this study illuminates the multifaceted role of m6A modifications in the dynamic between host and parasite during T. annulata infection. Beyond the direct implications for tropical theileriosis, the involvement of m6A methylation as a significant factor in host-pathogen dynamics has been showcased in various studies [56, 57]. For instance, Baumgarten et al described a dynamic and extensive m6A mRNA methylation program that fine-tunes the transcriptional cascade during blood-stage development of Plasmodium falciparum [56]. Additionally, Farhat et al. highlighted m6A's function in creating transcriptional barriers in Toxoplasma gondii, especially for closely located, stage-specific genes [57]. When considered alongside these discoveries, there seems to be a possible evolutionary strategy among parasites, like T. gondii and T. annulata, in shaping the m6A landscape of host cells. This underlines the critical role of m6A in the regulation of gene expression, be it aiding parasite adaptation or shaping host-pathogen interactions. Combining insights from both T. gondii and T. annulata provides a comprehensive perspective on the function of m6A in host-pathogen dynamics, promoting a well-rounded approach for deciphering these interactions. Such an understanding could pave the way for innovative m6A-centric therapeutic solutions against various intracellular pathogens.", "figs": [], "ents": ["m6a", "theileriaannulata", "tropicaltheileriosis"], "summary": "This discussion section from Malak Haidar's 2025 BJ article examines the complexities of translating research findings to in vivo scenarios, highlighting the role of m6A modifications in the host-parasite interaction during Theileria annulata infection."}], "figures": [{"id": "fig1", "name": "Figure 1", "caption": "Variation in m6A RNA methylation levels across T. annulata-infected leukocytes. A. Left and Right: RNA, extracted and treated with DNAse, was isolated from T. annulata-infected bovine macrophages (V), merozoite-producing bovine macrophages (Vm), infected bovine B cells (TBL20), and non-infected bovine B cells (BL20). m6A levels were assessed using an ELISA-like assay. B. Left and Right The proportion of m6A peaks in genes was determined from Me-RIP-seq data across various T. annulata-infected cell lines. *p value <0.05, **p value <0.005.", "text": "Figure 1: m6A RNA methylation levels are significantly elevated in T. annulata-infected bovine macrophages and B cells compared to non-infected bovine B cells, with p-values indicating high statistical significance (p < 0.005). The study finds a variation in the proportion of m6A peaks across different T. annulata-infected cell lines, suggesting that these modifications may play a critical role in virulence and disease progression at the host-parasite interface. This indicates that alterations in m6A methylation could be a key epitranscriptomic hallmark influencing the pathobiology of T. annulata infections.\n\nCaption: Variation in m6A RNA methylation levels across T. annulata-infected leukocytes. A. Left and Right: RNA, extracted and treated with DNAse, was isolated from T. annulata-infected bovine macrophages (V), merozoite-producing bovine macrophages (Vm), infected bovine B cells (TBL20), and non-infected bovine B cells (BL20). m6A levels were assessed using an ELISA-like assay. B. Left and Right The proportion of m6A peaks in genes was determined from Me-RIP-seq data across various T. annulata-infected cell lines. *p value <0.05, **p value <0.005.", "cited": ["article-10-1016-j-bj-2025-100828-sec3-p1"]}, {"id": "fig2", "name": "Figure 2", "caption": "Alteration in expression of m6A writers, readers, and erasers in T. annulata infected leukocytes. A. mRNA levels of m6A writers (mettl3, wtap, rbm15), readers (ythdf1 & 3, hnrnpa2b1), and erasers (alkbh5) were measured by qPCR in Theileria-infected macrophages (A) and TBL20 and BL20 (B). *p value <0.05, **p value <0.005, ***p value <0.001.", "text": "Figure 2: m6A writer genes mettl3, wtap, and rbm15 are upregulated in Theileria annulata-infected leukocytes with p-values <0.05, while the m6A eraser gene alkbh5 is downregulated (p < 0.005). The expression levels of m6A readers ythdf1 and ythdf3 are significantly altered in infected macrophages compared to uninfected controls. This indicates that m6A modifications are critically involved in the regulation of gene expression during Theileria infection, contributing to the parasite's virulence and the host's immune response.\n\nCaption: Alteration in expression of m6A writers, readers, and erasers in T. annulata infected leukocytes. A. mRNA levels of m6A writers (mettl3, wtap, rbm15), readers (ythdf1 & 3, hnrnpa2b1), and erasers (alkbh5) were measured by qPCR in Theileria-infected macrophages (A) and TBL20 and BL20 (B). *p value <0.05, **p value <0.005, ***p value <0.001.", "cited": ["article-10-1016-j-bj-2025-100828-sec3-p2"]}], "flags": [{"k": "Name variants merged", "d": "T. annulata / Theileria / Theileria annulata → Theileria annulata"}, {"k": "Name variants merged", "d": "WTAP / wtap → WTAP"}, {"k": "Name variants merged", "d": "RBM15 / rbm15 → RBM15"}, {"k": "Name variants merged", "d": "B20 / BL20 → BL20"}, {"k": "Name variants merged", "d": "PX-478 / PX478 → PX-478"}, {"k": "Name variants merged", "d": "B cells / B-cells → B-cells"}, {"k": "Likely wrong type", "d": "Apicomplexa typed as GENE; it is an organism or phylum."}, {"k": "Questionable link", "d": "mRNA linked to a specific NCBI gene record."}, {"k": "Likely wrong type", "d": "leukocytes typed as CELL_LINE and linked to a Cellosaurus record; it is a cell type, not a line."}, {"k": "Likely wrong type", "d": "macrophages typed as CELL_LINE and linked to a Cellosaurus record; it is a cell type, not a line."}, {"k": "Likely wrong type", "d": "Vm typed as GENE; in this paper it labels merozoite-producing macrophages."}, {"k": "Likely wrong type", "d": "merozoites typed as CELL_LINE and linked to a Cellosaurus record; it is a cell type, not a line."}, {"k": "Likely wrong type", "d": "Theileria typed as GENE; it is an organism or phylum."}, {"k": "Conflicting ontology IDs", "d": "m6A carries two different CHEBI identifiers across its variants."}, {"k": "Implausible claim", "d": "“genes methylates merozoites” — reversed or mis-parsed."}], "typeOrder": ["ORGANISM", "DISEASE", "GENE", "PROTEIN", "CHEMICAL", "DRUG", "CELL_LINE", "BIOLOGICAL_PROCESS", "METHOD", "DEVICE", "EQUIPMENT"]};
